[[decisions]]
  id = "dhi-docker-cli-client-plugins"
  repository = "dhi.io/docker"
  model = "inert-package"
  capabilities = ["docker-socket"]
  treatment = "accepted-risk"
  reviewed = "2026-09-30"
  review_by = "2026-11-18"
  reason = "The preset runs docker buildx build; the buildx plugin is static and the compose plugin is never invoked. The docker/docker CVEs are daemon-side handlers absent from both client plugins; the daemon is the host's. glibc is linked by the Go CLI, and the flagged paths are not the Go runtime's; the image's OpenSSL is linked by nothing the preset runs. No fix at any version. Added 2026-09-30, on the same footing: glibc (CVE-2026-19499): needs an application calling strfmon or strfmon_l with right-justified width padding into a small buffer; no tool here does. zlib (CVE-2026-85091): a heap overflow in the gzFile write path (gzprintf or gzwrite after a stalled non-blocking write); the tools here reach zlib through inflate and deflate, and none writes through gzFile on a non-blocking descriptor. docker/docker (GO-2026-4887): an AuthZ-plugin bypass on oversized request bodies, daemon-side code in the client library vendored here; the daemon is the host's. All are HIGH or CRITICAL with no fix at any version, EPSS at most 0.007, none in KEV (audit run 36565600041, 2026-09-29). Checked against the commands these presets run; re-argue if they start running the affected tool."
  references = []

