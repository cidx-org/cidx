[[decisions]]
  id = "commitizen-binutils-not-reached"
  repository = "commitizen/commitizen"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-02-17"
  reason = "Re-read 2026-11-19 against the scan of commitizen/commitizen:4.19.3 (binutils 2.45.1-r1), member by member; all five are HIGH, Grype reports no fix at any version (Trivy lists none of them), EPSS at most 0.006, none in KEV. The decision this one replaces also carried zlib CVE-2026-85091, pcre2 CVE-2026-89157 and -89161 and openssl CVE-2026-14456: this image no longer carries any of the four, so they left the file with it. The five are flaws in binutils programs and the BFD library: readelf (CVE-2025-69649 and -69650 are non-terminating output loops on crafted DWARF .debug_rnglists and .debug_loclists data; CVE-2026-6846 is a denial of service in readelf on a crafted ELF) and the BFD linker's XCOFF reader (CVE-2026-3441 and -3442, heap out-of-bounds reads when a crafted XCOFF object is linked). Each needs someone to run readelf or the linker on a hostile file. The preset runs cz check over commit messages: it parses text and executes no binutils program, and links nothing. Re-argue if the preset starts running a binutils tool."
  references = []

[[decisions]]
  id = "commitizen-sqlite-not-reached"
  repository = "commitizen/commitizen"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-18"
  reason = "Re-read 2026-11-19 against the scan of commitizen/commitizen:4.19.3, finding by finding; all four are HIGH on sqlite-libs 3.53.4-r0, none is in KEV, EPSS at most 0.016, and neither scanner reports a fixed version (Grype: unknown for CVE-2026-119373, -119374 and -119379, none for CVE-2026-119586; Trivy lists none). CVE-2026-119373 (a heap overflow in FTS5 prefix queries over detail=none tables with negative rowids), CVE-2026-119374 (FTS5 secure-delete over a crafted index) and CVE-2026-119379 (sqlite3changeset_apply on a crafted changeset) each need a program that opens a database file, or applies a changeset, that somebody else supplied. CVE-2026-119586 is in the sqlite3 shell's .recover command, which emits dot-commands planted in a database's schema into a script a person pipes back to the shell: it needs the shell and a typed command. The commitizen preset runs cz check over commit messages, opens no database, and the image runs no sqlite3 shell. Grype could not say whether a fix exists, so the review is a month out: at the next one, check the Alpine sqlite package for a release past 3.53.4-r0 and repin instead of renewing. Re-argue if the preset starts opening databases."
  references = []

[[decisions]]
  id = "dhi-docker-cli-client-plugins"
  repository = "dhi.io/docker"
  model = "inert-package"
  capabilities = ["docker-socket"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "The preset runs docker buildx build against the host's daemon through its socket: the docker CLI and the buildx plugin are Go programs, the compose plugin is never invoked, and none of them speaks TLS through OpenSSL. Re-read 2026-11-19 against the scan of dhi.io/docker:29-cli, finding by finding; none is in KEV. The twelve below are all HIGH with no fix at any version; the one finding that has a fix is not here (see the end). github.com/docker/docker (GO-2026-4887, CVE-2026-34040): an AuthZ-plugin bypass on oversized request bodies, a handler of the daemon that the Go module also contains; the image holds docker clients and no daemon, no AuthZ plugin runs here, and the daemon this preset talks to is the host's. Its EPSS is 0.09469, far above the 0.007 the earlier reviews of this image recorded for the batch and above 95% of the catalogue (below 0.02); that is why it is argued on its own and why the review is two months and not three: at the next one, check whether dhi.io/docker has been rebuilt with a daemon-side fix and repin instead of renewing. OpenSSL (libssl3t64, openssl, openssl-provider-legacy 3.5.7-1~deb13u3+dhi1, EPSS at most 0.006), linked by nothing the preset runs: CVE-2026-107493 (PEM_X509_INFO_read_bio_ex handed an existing stack), CVE-2026-107496 (CMS_encrypt looping on an EC certificate of group order 1), CVE-2026-124709 (a QUIC server retaining rejected streams), CVE-2026-95691 (a use-after-free in the QUIC client), CVE-2026-88823 and CVE-2026-95692 (AES-GCM-SIV AAD and IV handling) each need an application that calls that OpenSSL API or speaks QUIC through it, and the Go programs here use crypto/tls. glibc (libc6 2.41-12+deb13u4+dhi1, EPSS at most 0.003): glibc is linked by the Go CLI, and the flagged paths are not ones Go's runtime uses: CVE-2026-19499 needs strfmon or strfmon_l with right-justified width padding into a small buffer; CVE-2026-5435 is the deprecated resolver printers ns_printrr, ns_printrrf and fp_nquery; CVE-2026-84243 is gettext loading a crafted .mo catalogue named through LANGUAGE, which needs a non-C locale, an attacker-controlled environment and a crafted file, and the Go programs do not use gettext. libstdc++ (gcc-14-base, libgcc-s1; EPSS at most 0.005): CVE-2026-102010 (erase_if on a pb_ds binary-heap priority queue, a header-only template) and CVE-2026-95619 (an integer overflow in the aligned operator new) need a C++ program, and no preset compiles or runs one here. Not accepted: GO-2026-6865 on github.com/klauspost/compress v1.20.0 (a panic on two-block frames) has a fix in 1.20.2, so it is a repin question for the image, not a decision; and zlib (CVE-2026-85091) and the libssl DTLS, server-side and QUIC-flood findings argued earlier are no longer carried by this image, so their acceptances were removed. Re-argue if the preset starts running a daemon, compose or any tool of the image beyond buildx."
  references = []

[[decisions]]
  id = "dhi-golang-binutils-not-reached"
  repository = "dhi.io/golang"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-02-17"
  reason = "Re-read 2026-11-19 against the scan of dhi.io/golang:1.26.11-alpine-dev (binutils 2.46.0-r0), member by member; both are HIGH, Grype reports no fix at any version (Trivy lists neither), EPSS at most 0.003, not in KEV. The decision this one replaces also carried zlib CVE-2026-85091 and pcre2 CVE-2026-89157 and -89161: the image no longer carries any of the three, so they left the file with it. CVE-2026-3441 and CVE-2026-3442 are both a heap out-of-bounds read in the bfd linker when it processes a crafted XCOFF object file, and need someone to convince a user to link that file. XCOFF is AIX's object format: the go toolchain's cgo path hands the system linker ELF objects the compiler has just produced from the repository's own sources on a Linux host, never an XCOFF file from outside, and no preset here runs readelf, objdump or ld by hand on a file somebody else supplied. Re-argue if a preset starts running a binutils tool on an input the repository does not build."
  references = []

[[decisions]]
  id = "dhi-python-interpreter-bounded-input"
  repository = "dhi.io/python"
  model = "tool-bounded-input"
  capabilities = ["publishing-credential"]
  requires = ["bounded-input"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "tarfile and zipfile are exercised by pip on sdists and wheels, for pip-audit and the installs python-build and pytest perform; twine reads the dist/ the repository built. The input is the repository's own code and PyPI's responses for the packages it pins, the context established 2026-08-22. Re-read 2026-11-19 against the scan of dhi.io/python:3.13.14-alpine-dev (python-3.13 3.13.14-r3): CVE-2026-11940, -11972, -15308 and -82049 are HIGH, none is in KEV, EPSS at most 0.0075, and neither scanner names a fixed version (Grype's fix state is unknown, Trivy lists none). The python-3.13 advisories on this package are of two kinds: tarfile extraction-filter bypasses (a hard link to a symlink stored at a deeper name, link entries with empty or directory-like names, intermediate directories created outside the destination, a filter result ignored on systems without links), whose worst outcome is an empty directory, a changed mode or mtime, or a file read from outside the destination, never code execution; and memory exhaustion from an attacker-controlled size when decompressing a crafted zip. Both need a crafted archive, and the only archives pip opens here are the sdists and wheels of the packages the repository pins, fetched over TLS from PyPI; nobody else's bytes arrive. The fix state is unknown rather than none, so at the next review check the Alpine python-3.13 package for a release past 3.13.14-r3 and repin instead of renewing. Re-argue if a preset starts extracting archives from anywhere but the pinned index."
  references = []

[[decisions]]
  id = "dhi-python-binutils-not-reached"
  repository = "dhi.io/python"
  model = "inert-package"
