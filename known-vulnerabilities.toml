[[decisions]]
  id = "dhi-python-cve-2026-115557"
  repository = "dhi.io/python"
  model = "tool-bounded-input"
  capabilities = ["publishing-credential"]
  requires = ["bounded-input"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-18"
  reason = "CVE-2026-115557 (CRITICAL, python-3.13 3.13.14-r3, EPSS 0.00534, not in KEV, first carried in the 2026-11-19 scan; Grype's fix state is unknown, Trivy lists nothing): the advisory is that this CPython lacks a denylist of known compromised certificates in the ssl module, which newer releases add so that such a certificate is rejected whatever the SSLContext policy says. What it costs here: a TLS server presenting a chain through one of those certificates would be accepted where a newer Python would refuse it. The only TLS connections the interpreter makes are pip's and twine's to PyPI, with certificate verification and hostname checking on, against Alpine's CA bundle; exploiting the gap needs an attacker who holds a key chaining to a compromised intermediate and sits on the path between the runner and pypi.org, and what it would get is the ability to answer pip's requests with its own bytes, which is the case the bounded-input context already treats as the one input channel. It does not touch the repository's source or the token: twine uploads the token to PyPI's own endpoint, whose certificate chain is not one of the denylisted ones. The severity is a scanner's reading of a missing hardening list, not a memory-safety flaw. The review is a month out on purpose: at the next one, check the Alpine python-3.13 package for a release past 3.13.14-r3 and repin instead of renewing. Re-argue if the preset starts talking TLS to hosts other than the pinned index."
  references = []

[[decisions]]
  id = "dhi-python-cve-2026-19445"
  repository = "dhi.io/python"
  model = "tool-features-unused"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-18"
  reason = "CVE-2026-19445 (CRITICAL, python-3.13 3.13.14-r3, EPSS 0.00524, not in KEV, first carried in the 2026-11-19 scan; Grype's fix state is unknown, Trivy lists nothing): a remote, unauthenticated TLS client can crash a Python TLS server, or make it call through a freed pointer, when the server's sni_callback assigns a different ssl.SSLContext to SSLSocket.context and nothing else keeps the original context alive. It is a server-side flaw: it needs a Python process that listens, wraps accepted sockets in an SSLContext that has an sni_callback, and answers a stranger's ClientHello. Nothing in this container listens, and no preset runs a TLS server: pip, twine, pytest, python-build and pip-audit are TLS clients, and an SSLContext with an sni_callback is never constructed by any of them. A client has no ClientHello to receive, so the freed pointer is never reached. The review is a month out on purpose: at the next one, check the Alpine python-3.13 package for a release past 3.13.14-r3 and repin instead of renewing. Re-argue if a preset starts a server in this image."
  references = []

[[decisions]]
  id = "dhi-python-tls-client-and-sqlite-not-reached"
  repository = "dhi.io/python"
  model = "inert-package"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-18"
  reason = "Re-read 2026-11-19 against the scan of dhi.io/python:3.13.14-alpine-dev, finding by finding; all five are HIGH, none is in KEV, EPSS at most 0.016, and neither scanner reports a fixed version (Grype: unknown for four, none for CVE-2026-119586; Trivy lists none). CVE-2026-19553 (python-3.13): ssl.SSLContext.wrap_bio() did not insist on server_hostname when check_hostname is set, so a program that uses the BIO interface without a hostname verifies the certificate chain but silently skips the hostname check. The flaw is in a program's own use of wrap_bio; pip and twine reach TLS through urllib3, which calls wrap_socket with the server_hostname it has, and no preset here writes a wrap_bio call. sqlite-libs 3.53.2-r0: CVE-2026-119373 (a heap overflow in FTS5 prefix queries over detail=none tables with negative rowids), CVE-2026-119374 (FTS5 secure-delete over a crafted index) and CVE-2026-119379 (sqlite3changeset_apply on a crafted changeset) each need a program that opens a database file or applies a changeset from somebody else; CVE-2026-119586 is in the sqlite3 command-line shell's .recover command, which emits dot-commands planted in a database's schema into a script a person pipes back to the shell. The python-3.13 package links sqlite-libs for its sqlite3 module, but pip, twine, pytest, python-build and pip-audit open no SQLite database from outside the checkout, no preset runs the sqlite3 shell, and .recover is a command somebody has to type. The review is a month out on purpose, because Grype could not say whether a fix exists: at the next one, check the Alpine python-3.13 and sqlite packages for releases past 3.13.14-r3 and 3.53.2-r0 and repin instead of renewing. Re-argue if a preset starts opening databases or running the sqlite3 shell."
  references = []

[[decisions]]
