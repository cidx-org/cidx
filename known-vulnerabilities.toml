# Known Vulnerabilities
#
# Accepted HIGH/CRITICAL findings on the images the built-in preset catalogue
# runs. An entry is a judgement about a CVE in a repository, in our usage: it is
# keyed by repository and CVE, and it dies when no catalogue image carries the
# CVE any more, or when it expires — never because a tag moved.
#
# A vulnerability that is fixed upstream never belongs here: that is a question
# about the image's age, not a decision. "cidx security vuln add" refuses one.
#
# One narrow exception, treatment "fix-unreleased": the fix exists in the
# distribution or the module, but the NEWEST release of the tool's image does not
# ship it yet, so there is nothing to repin to. The catalogue is first repinned
# to that newest release; the decision names the finding, the installed version,
# the fix and the day it was scanned, and lives at most 30 days (review_by). It is
# a repin candidate at every review, never a renewal by default.
#
# Fields:
#   cve        - CVE (or GHSA) identifier
#   repository - Affected repository, without tag or digest
#   first_seen - The reference it was first recorded against (context only)
#   severity   - HIGH or CRITICAL
#   status     - awaiting-upstream | accepted-risk | mitigated | third-party |
#                fix-unreleased (narrow: see above)
#   added      - Date when this exception was added (YYYY-MM-DD)
#   expires    - Date to re-check (YYYY-MM-DD), typically 30-90 days
#   notes      - Explanation of why this is accepted
#   references - Links to upstream issues/PRs tracking the fix
#   decision   - The [[decisions]] entry authorizing this waiver; absent means a
#                legacy entry judged on its own expiry
#
# A fix-unreleased decision also lists "advisories", the CVE/GO identifiers it
# covers. "cidx security scan" marks the results of exactly those advisories on
# that repository (exceptionCategory, exceptionReason) while review_by stands;
# another advisory on the same image is not marked.
#
# [[decisions]] is one reviewed exposure judgement about a repository under the
# aggregate context of every preset consuming it: id, repository, model,
# capabilities (the mechanical context it was reviewed against), requires (the
# semantic predicates it depends on), treatment, reviewed, review_by, reason,
# references. [[contexts]] records, per repository, what a review established
# that no declaration can derive: established, reviewed, basis.
# See docs/discussions/vulnerability-decision-workflow.md.
#
# Generated by "cidx security vuln add" and "cidx security vuln prune"; hand edits
# survive as long as they follow this layout.

[[contexts]]
  repository = "dhi.io/python"
  established = ["bounded-input"]
  reviewed = "2026-08-22"
  basis = "The interpreter consumes the repository's own code and tests, the dist/ the repository built, and PyPI's responses for the packages the repository pins. No preset parses content from outside the checkout and the pinned index."

[[contexts]]
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  established = ["bounded-input"]
  reviewed = "2026-08-22"
  basis = "molecule and ansible-test drive containers from the repository's own scenarios through the host socket; ansible-galaxy-publish uploads the collection built from the repository with its token. No preset parses content from outside the checkout."

[[decisions]]
  id = "ansible-dev-tools-kubectl-vendored-libraries"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-15"
  review_by = "2026-12-15"
  reason = "runc, containerd, docker/docker and selinux are vendored into /usr/local/bin/kubectl, which no preset invokes; the vulnerable paths need a container to be run by that binary, and kubectl runs none (docker/docker's flaws are daemon-side handlers -- container archive API, docker cp, the AuthZ plugin -- absent from a client binary). Fixed versions exist at module level and reach us only when the image ships a rebuilt kubectl. Re-argued 2026-09-30 against audit run 36565600041 and a fresh scan of v26.9.0, the newest upstream tag: its kubectl still vendors runc 1.1.13, containerd 1.7.11, docker/docker 27.1.1 and selinux 1.12.0, so no image ships the fix. As decided 2026-08-22 for exactly this case, the treatment is now accepted-risk under the inert model rather than awaiting-upstream -- the blast radius, if inertness is wrong, includes the Docker socket and the Galaxy token -- rather than disabling seven presets over an uninvoked library. The review is a month out on purpose: at each one, scan the newest tag, and if an image has rebuilt kubectl, repin instead of renewing. Reviewed 2026-11-15 by that protocol: the newest upstream tag, ghcr.io/ansible/community-ansible-dev-tools:v26.11.0 (sha256:f9caf58a32195c1c2d23cd2ef7f465bc89dd1c6adffa44cd144689b1d41a575a), was scanned; go version -m on its /usr/local/bin/kubectl (openshift/oc c91286873566, go1.24.13) still shows containerd v1.7.11, docker/docker v27.1.1, runc v1.1.13 and selinux v1.12.0, unchanged. No image ships the fix, so there is nothing to repin to: the decision is renewed, not repinned, for another month, and the inertness argument (no preset invokes kubectl) still holds. Added 2026-11-19: GO-2026-6791 (CVE-2026-95837, HIGH, fix state none), a checkpoint restore in containerd's CRI plugin that bypasses the destination security context; it needs a containerd daemon with the CRI plugin restoring a checkpoint, which is server-side and absent here, the only carrier being containerd v1.7.11 linked into the same uninvoked kubectl. The two CRITICAL containerd findings (GO-2026-5064, GO-2026-5338) are no longer covered by this shared reason; each has its own decision."
  references = ["https://github.com/opencontainers/runc/releases/tag/v1.2.8", "https://github.com/containerd/containerd/releases/tag/v1.7.29"]

[[decisions]]
  id = "ansible-dev-tools-containerd-cri-cdi-annotation"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-15"
  reason = "CRITICAL GO-2026-5064 (CVE-2026-53492): containerd's CRI checkpoint restore lets a CDI device annotation in a checkpoint archive be smuggled into the restored container. It lives in containerd's CRI plugin, the server side that a kubelet drives to restore a checkpointed pod; nothing in this image runs a containerd daemon, and the only carrier is github.com/containerd/containerd v1.7.11 linked into /usr/local/bin/kubectl (openshift/oc c91286873566, go1.24.13), which no preset invokes and which restores no checkpoint. Re-checked 2026-11-19 on the Grype scan of v26.11.0: the finding is still reported with fix state none for the containerd 1.7 line, so there is no image or module version to repin to. Grype EPSS 0.0035. Review date follows the kubectl decision, whose month-out protocol applies: scan the newest tag at each review and repin if kubectl has been rebuilt."
  references = []

[[decisions]]
  id = "ansible-dev-tools-containerd-cri-checkpoint-import"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-15"
  reason = "CRITICAL GO-2026-5338 (CVE-2026-50195): importing a checkpoint through containerd's CRI lets a local attacker poison an image tag, so a later pull of that tag resolves to attacker content. The attack needs a containerd daemon with the CRI plugin accepting a checkpoint import and a local actor who can submit it; this image runs no daemon, the carrier is containerd v1.7.11 linked into /usr/local/bin/kubectl, which no preset invokes, and the presets reach the host's image store through the Docker or podman socket, never through containerd's CRI. Re-checked 2026-11-19 on the Grype scan of v26.11.0: still reported, fix state none, nothing to repin to. Grype EPSS 0.0030. The consequence if inertness were wrong -- a poisoned tag run next to the Docker socket and the Galaxy token -- is why it carries its own review date and not a longer one."
  references = []

[[decisions]]
  id = "ansible-dev-tools-podman-bounded-input"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "tool-bounded-input"
  capabilities = ["docker-socket", "publishing-credential"]
  requires = ["bounded-input"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "podman is a tool a preset may run; what bounds it is the input -- the repository's own molecule scenarios -- and the socket it reaches is the host's. Re-read 2026-11-19 against the Trivy/Grype scan of ghcr.io/ansible/community-ansible-dev-tools:v26.11.0 (sha256:f9caf58a32195c1c2d23cd2ef7f465bc89dd1c6adffa44cd144689b1d41a575a), the newest upstream tag at the 2026-11-15 review: Grype still reports both members against github.com/containers/podman/v5, with fix state not-fixed, so there is no fix to repin to and the decision is renewed, not repinned. Both are HIGH with EPSS under 0.007. GHSA-M68Q-4HQR-MC6F (CVE-2025-4953, a temporary file created with insecure permissions): the exposure is another local principal reading or replacing a file podman wrote, and a CI container is single-tenant for the length of one run, with no second local user. GHSA-RPCC-P8XM-RC6P (CVE-2024-3056, memory-based denial of service): the impact is availability of one throw-away run, reachable only by feeding podman crafted input, and the only input a preset hands it is the repository's own molecule scenarios. Re-argue if a preset starts running podman over content from outside the checkout. The other podman advisories on this image (GHSA-2CVF-WQM6-WR9G, GHSA-4HQ8-GPF5-8P68, GHSA-65GG-3W2W-HR4H, GHSA-WP3J-XQ48-XPJW) have fixes and are a repin, not part of this decision."
  references = []

[[decisions]]
  id = "black-system-libraries-not-reached"
  repository = "pyfound/black"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "The vulnerable code sits in the Debian base layer of black's image and is not exercised by what its preset runs: `black --check .` reads the repository's Python files from the mounted workspace, opens no socket, starts no server and runs no other program. Re-read 2026-11-19 against a fresh Trivy and Grype scan of the pinned digest (pyfound/black:26.5.1), member by member; every member below is HIGH, has no fix in either scanner (wont-fix, not-fixed, affected or fix_deferred), and has EPSS at most 0.0063. Members whose fix has since been published (perl, gzip, sqlite, glibc and OpenSSL updates, among them CVE-2026-72897, -84782, -84784 and zlib CVE-2026-85091 that this decision used to carry) were removed from it: they are a repin, not a decision. util-linux (bsdutils and its libraries; CVE-2026-76642, -78408, -78409, -78410): local privilege escalations against mount(8)'s fstab hooks and nsenter, which need an unprivileged local attacker and a privileged (SUID) helper with an authorized fstab entry. A container has no fstab, runs as an unprivileged uid, and the preset runs neither mount nor nsenter. libsystemd0 and libudev1 (CVE-2026-16742): a systemd-homed local privilege escalation; no systemd runs in a container and nothing here talks to it. perl-base: CVE-2026-82560 is CPU exhaustion formatting a crafted POD document, and nothing here runs pod2text or Pod::Text; CVE-2026-9538 is memory exhaustion in Archive::Tar from an attacker-chosen entry size in a tar header, and nothing here runs perl, let alone Archive::Tar on a tar file. glibc: CVE-2026-19499 needs an application calling strfmon or strfmon_l with right-justified width padding into a small buffer, which no tool here does; CVE-2026-5435 is an out-of-bounds write in the deprecated resolver printers ns_printrr, ns_printrrf and fp_nquery when printing TSIG records, and Python and black make no DNS query and print no resource records; CVE-2026-84243 lets whoever controls LANGUAGE (and a second locale variable) in a program's environment load a message catalog from an arbitrary path, and needs a crafted .mo file where the program can read it and an environment crossing a trust boundary, as an SSH server accepting client variables does; here the runner sets the environment and the only writable input is the repository's own checkout. ncurses (CVE-2025-69720; libtinfo6, libncursesw6, ncurses-base, ncurses-bin): the overflow is in the infocmp command-line tool (analyze_string in progs/infocmp.c), and nothing here runs infocmp. libacl1 (CVE-2026-54369, -54370): symlink traversal and a check-then-use race in libacl's pathname functions and in getfacl, setfacl and chacl, which matter only to a privileged caller working over a path an attacker controls; the preset runs unprivileged over the user's own checkout and calls none of them. SQLite (libsqlite3-0; CVE-2026-119373, -119374, -119379): heap overflows in FTS5 prefix queries on detail=none tables with negative rowids, in FTS5 secure-delete on a crafted index, and in sqlite3changeset_apply on a crafted changeset; each needs a program that opens a database, and black opens none. OpenSSL (libssl3t64, openssl, openssl-provider-legacy): black runs offline, so no TLS handshake of any kind happens in this container. CVE-2026-107493 needs an application passing a non-NULL stack to PEM_X509_INFO_read_bio_ex and reusing it after a failed read, which OpenSSL's own callers never do and nothing here calls. CVE-2026-107496 needs CMS_encrypt to an EC recipient certificate of group order 1, and nothing here encrypts CMS messages. CVE-2026-88823 and CVE-2026-95692 concern AES-GCM-SIV (a zero-length AAD update, a wrong-length IV), an algorithm only the default provider offers, that TLS never selects and no tool here uses. CVE-2026-124709 is a memory leak in a QUIC server that rejects a stream and CVE-2026-95691 a use-after-free in a QUIC client fed by a malicious QUIC server; nothing here runs a QUIC server or speaks QUIC. gcc and libstdc++ (gcc-14-base, libgcc-s1, libstdc++6): CVE-2026-102010 is a use-after-free in erase_if on libstdc++'s pb_ds binary-heap priority queue, a header-only template instantiated into an application at build time, so these runtime packages hold none of it; CVE-2026-95619 is an integer overflow in the aligned operator new, which needs a C++ program asking for an attacker-sized aligned allocation, and the image runs a Python formatter and no C++ program. Re-argue if the preset starts running any of the affected tools or opens network connections."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-features-not-used"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "cargo-audit runs one curl: curl -sSfL -o /tmp/cargo-audit.tgz on a fixed github.com release URL, then checks the archive against a pinned sha256 before tar reads it. The command passes no credentials, proxy, netrc, cookie jar, HSTS file, client certificate, --interface, --proto-default, -J, -w, --aws-sigv4, --crlf, --pinnedpubkey or --parallel, speaks https only, and curl's default redirect protocols are http, https, ftp and ftps; the only server that answers is GitHub's. Re-read 2026-11-19 against the scan of the pinned digest, finding by finding: every one is HIGH, none has a fix at any version, none is in KEV, EPSS at most 0.012. Cookies: CVE-2026-80255 and CVE-2026-82209 (cookie handling) and CVE-2026-92386 (a long cookie record written to a Netscape cookie jar) need the cookie engine, which -b and -c switch on and this command does not. CVE-2026-87862 and CVE-2026-87863 (HSTS import and cache save) need --hsts. Authentication and connection reuse: CVE-2026-8458 (Negotiate connections reused across services), CVE-2026-8932 (client-certificate options left out of the reuse match), CVE-2026-86409 (SigV4 state kept after being unset) and CVE-2026-107929 (CURLOPT_INTERFACE left out of the reuse key) each need an option the command never sets and a handle reused for a second transfer; one handle makes one transfer here. CVE-2026-94266 (credentials in CURLINFO_EFFECTIVE_URL) needs credentials in the URL, and the URL carries none. TLS: CVE-2026-80230 (public-key pinning with verification disabled) needs --pinnedpubkey and -k; verification stays on. CVE-2026-9545 (HTTP/3 early data on a cached session) needs --http3 and early data, neither requested. CVE-2026-107928 concerns curl built with GnuTLS sending WebSocket data; the flagged packages are curl and libcurl4t64, Debian's OpenSSL build, and the URL is neither ws:// nor wss://. Other protocols: CVE-2026-13608 (LDAP SASL) and CVE-2026-107161 (Cyrus SASL DIGEST-MD5 client, reached through libcurl's LDAP and mail protocols) need ldap://, imap:// or alike; CVE-2026-87864 (IMAP APPEND with CURLOPT_CRLF), CVE-2026-92387 (control-response timeout of FTP, IMAP, POP3 and SMTP) and CVE-2026-92389 (TFTP state machine) need those servers; CVE-2026-87865 (libssh2 known_hosts), CVE-2026-12064 and CVE-2026-86410 (SSH host verification skipped for a schemeless sftp or scp URL, or after a redirect to one) need an ssh-family transfer: the URL names https, no --proto-default is set, and sftp and scp are outside the default redirect protocols. Tool-only and library-API flaws: CVE-2026-92390 needs --remote-header-name, which the command does not use (it names its output with -o); CVE-2026-9080 (curl_easy_pause inside a CURLMOPT_SOCKETFUNCTION callback), CVE-2026-92391 (a deeply nested MIME tree freed by curl_mime_free) and CVE-2026-80229 (pooled TLS connections outliving their handle) are about an application driving libcurl's API, which the command's single transfer does not. The two CRITICAL curl CVEs this decision used to carry (CVE-2026-18924, CVE-2026-19931) have their own decisions. Re-argue if the command starts using any of these options or protocols."
  references = []

[[decisions]]
  id = "buildpack-deps-system-libraries-not-reached"
  repository = "buildpack-deps"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-02-17"
  reason = "The vulnerable code sits in the Debian base layer of the cargo-audit image and is not exercised by what the preset runs (sh, uname, sha256sum, curl on one fixed URL, tar, cargo-audit). Re-read 2026-11-19 against the scan of the pinned digest, finding by finding: every one is HIGH, none has a fix at any version, none is in KEV, EPSS at most 0.007. util-linux (bsdutils, mount, login and the lib packages; CVE-2026-76642, -78408, -78409, -78410): local privilege escalations against mount(8)'s fstab hooks and nsenter, which need an unprivileged local attacker and a privileged (SUID) helper with an authorized fstab entry. A container has no fstab, runs as an unprivileged uid, and no preset here runs mount or nsenter. libsystemd0 (CVE-2026-16742): a systemd-homed local privilege escalation; no systemd runs in a container and nothing here talks to it. perl-base: CVE-2026-82560 is CPU exhaustion formatting a crafted POD document, and nothing here runs pod2text or Pod::Text; CVE-2026-9538 is memory exhaustion in Archive::Tar from an oversized entry size in a tar header, and nothing runs perl: the archive is read by GNU tar, after its sha256 has been checked. glibc: CVE-2026-19499 needs an application calling strfmon or strfmon_l with right-justified width padding into a small buffer, and no tool here does; CVE-2026-5435 is the deprecated resolver printing functions ns_printrr, ns_printrrf and fp_nquery writing past a caller-supplied buffer when printing TSIG records, which curl, tar and a Rust binary do not call; CVE-2026-84243 is gettext honouring '/' and '..' in LANGUAGE to load a crafted .mo catalogue, which needs a non-C locale, an attacker-controlled environment and a crafted file on disk: the preset sets no locale variable and nothing here places such a file. libstdc++ (gcc-14-base, libgcc-s1, libstdc++6): CVE-2026-102010 (erase_if on libstdc++'s binary-heap priority queue, a GNU pb_ds extension in a header-only template, so the flagged packages hold none of it at run time) and CVE-2026-95619 (an integer overflow in the aligned operator new) both need a C++ program, and none of sh, curl, tar, sha256sum (C) or cargo-audit (Rust) is one. Re-argue if the command starts running an affected tool."
  references = []

[[decisions]]
  id = "buildpack-deps-openssl-features-not-used"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "Unlike the packages in the other decisions, libssl3t64 is used: curl's TLS client opens one https connection to github.com. What each flaw needs is something else. Re-read 2026-11-19 against the scan of the pinned digest: all six are HIGH on openssl, openssl-provider-legacy and libssl3t64 3.5.7-1~deb13u3, not fixed in Debian at any version, none in KEV, EPSS at most 0.006. CVE-2026-107493 needs an application to hand PEM_X509_INFO_read_bio_ex an existing stack and keep using it after a failed read; the PEM it reads here would be the image's own CA bundle, not bytes anyone else chose. CVE-2026-107496 is CMS_encrypt looping on an EC recipient certificate of group order 1; the advisory says TLS and QUIC do not use that path, and nothing here encrypts CMS. CVE-2026-124709 is a QUIC server retaining rejected streams; curl is a client and nothing here listens. CVE-2026-95691 is a use-after-free in the QUIC client on a retransmitted CRYPTO frame, reached only by an HTTP/3 or other QUIC transfer, which needs --http3 and is not requested: the download runs over TCP. CVE-2026-88823 and CVE-2026-95692 are in AES-GCM-SIV, which is not a TLS cipher suite and which no program here calls. Re-argue if the command starts using QUIC, CMS or an OpenSSL application of its own."
  references = []

[[decisions]]
  id = "buildpack-deps-krb5-features-not-used"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "The image carries MIT krb5's client libraries (libkrb5-3, libgssapi-krb5-2, libk5crypto3, libkrb5support0) because libcurl links them for Kerberos and Negotiate authentication, which this command never asks for: no credentials, no --negotiate, no ticket cache. The same source package would also be flagged on krb5-kdc and krb5-admin-server if either were installed; neither is. Re-read 2026-11-19 against the scan of the pinned digest, CVE by CVE: all sixteen are HIGH, none in KEV, EPSS at most 0.013, no fix in Debian. Most live in server code the image has no program for. KDC: CVE-2026-107364 (a large read overrun answering an unauthenticated request), CVE-2026-119079 (CPU from a long SEQUENCE OF in an AS-REQ or TGS-REQ), CVE-2026-71200 (PKINIT null dereference), CVE-2026-71199 (authentication-indicator bypass through an unkeyed CAMMAC checksum, enforced by a KDC or service). kadmind and its GSS-RPC layer: CVE-2026-112315 (RPCSEC_GSS decode leak), CVE-2026-112316 (xdr_krb5_tl_data leak), CVE-2026-112317 (key material leaked on a failed check, KDC or kadmind), CVE-2026-112318 (policy RPC null dereference), CVE-2026-112319 (unbounded XDR allocations), CVE-2026-112320 (auth context kept when a client switches flavour), CVE-2026-112321 (AUTH_GSSAPI arguments not freed), CVE-2026-112322 (quadratic client-list cleanup), CVE-2026-112323 (client state kept 15 minutes after failed requests). GSS acceptors and RPC clients: CVE-2026-107778 (a null dereference in gss_accept_sec_context when it receives mismatched KRB-CRED arrays: curl only initiates), CVE-2026-112314 (a leak in clnttcp_call, used by GSS-RPC client programs such as kadmin, which are not here), CVE-2026-118380 (an active attacker altering arguments to RPC services protected by RPCSEC_GSS: no such service or client runs here). Re-argue if the command starts authenticating with Kerberos or running a krb5 program."
  references = []

[[decisions]]
  id = "buildpack-deps-unused-programs-and-libraries"
  repository = "buildpack-deps"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-02-17"
  reason = "Programs and libraries in the Debian base layer that no command of the cargo-audit preset runs or loads (sh, uname, sha256sum, curl, tar, cargo-audit). Re-read 2026-11-19 against the scan of the pinned digest: every one is HIGH, none has a fix at any version, none is in KEV, EPSS at most 0.006. libsqlite3-0: CVE-2026-119373 (FTS5 detail=none prefix MATCH over negative rowids), CVE-2026-119374 (FTS5 secure-delete over a corrupted index) and CVE-2026-119379 (sqlite3changeset_apply on crafted changesets) all need a program that opens SQLite databases or applies changesets from outside, and none of the tools here does. gnupg (dirmngr, gpg, gpg-agent, gpgconf, gpgsm, gnupg-l10n): CVE-2026-24882 is a stack overflow in tpm2daemon handling PKDECRYPT for TPM-backed keys; no command runs gpg and a container has no TPM. acl (libacl1): CVE-2026-54369 and CVE-2026-54370 are symlink traversal and a TOCTOU race in the pathname functions, exploitable when a privileged process runs getfacl, setfacl or chacl over a path an attacker controls; nothing here calls them, and tar extracts a sha256-checked archive into /tmp without restoring ACLs. wget: CVE-2026-58469 (Metalink URL underread), CVE-2026-58471 (iconv filename conversion overflow) and CVE-2026-58472 (HTML attribute quoting overflow) need wget to fetch from a hostile server; the preset downloads with curl and never runs wget. ncurses (libncursesw6, libtinfo6, ncurses-base, ncurses-bin): CVE-2025-69720 is a stack overflow in the infocmp tool; nothing runs infocmp. Re-argue if the command starts running any of these."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-10536"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-10536 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00598, not in KEV): a use-after-free when an application sets an HTTP/2 stream-dependency tree with CURLOPT_STREAM_DEPENDS or CURLOPT_STREAM_DEPENDS_E, calls curl_easy_reset, then curl_easy_cleanup. All three are libcurl API calls made by a program embedding the library, in that order, on one handle. The curl command line sets no stream dependency, and cargo-audit's preset runs the tool once for one https download and exits: nothing resets a handle after configuring dependencies. Re-argue if the preset runs anything that embeds libcurl."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-11856"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-11856 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00688, not in KEV): after a transfer to hostA authenticated with Digest, a second transfer on the same handle to hostB wrongly sends hostA's Authorization header. It needs a Digest login and a handle reused across origins. The preset's curl is given no credentials and no --digest, makes a single transfer, and so has no Authorization header to leak; a redirect from github.com to its release host is a new connection in the same transfer, with nothing to forward. Re-argue if the command starts passing credentials to curl."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-8926"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-8926 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00444, not in KEV): with a .netrc in use and a URL carrying a user name but no password, curl may use the password of another user on that host. The command does not pass --netrc or -n, its URL has no user name, and the preset provides no .netrc to the container. Both preconditions are missing. Re-argue if the command starts using netrc."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-9079"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-9079 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.01064, not in KEV): libcurl fails to clear proxy authentication credentials when told to, so the old ones are used by later transfers. It needs proxy credentials to have been set and then cleared on a handle that goes on to another transfer. The command sets no proxy and no proxy credentials, and makes one transfer, so there is nothing to clear and no later transfer. Re-argue if the command starts going through a proxy."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-18924"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-18924 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00584, not in KEV): HTTP/2 server push combined with shared handles. A pushed stream is only accepted when the application installs a push callback, and the shared-handle half is the library's CURLSH API; the command runs one non-parallel transfer, installs no push callback and shares nothing, so a GitHub release host has no push to accept. Re-argue if the command starts using --parallel or embeds libcurl."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-19931"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-19931 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00747, not in KEV): a Negotiate-authenticated connection reused for a request that should have used another service. It needs Negotiate authentication and a second request on the same pool. The command passes no --negotiate, no credentials and no Kerberos ticket cache, so no connection is ever Negotiate-authenticated, and it makes one request. Re-argue if the command starts authenticating with Kerberos."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-cve-2026-86414"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-86414 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00676, not in KEV, first carried in the 2026-11-19 scan): an HTTP proxy that answers a CONNECT with 401 WWW-Authenticate instead of 407 can make libcurl send the origin's credentials (Basic password or a Negotiate ticket) to the proxy. It needs a proxy in the path and origin credentials to send. The command sets no -x and passes no credentials, so there is no proxy to answer and nothing to hand over. Re-argue if the command starts going through a proxy or passing credentials."
