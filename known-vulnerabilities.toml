  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "goreleaser and the buildx plugin are Go programs: the image's binutils is not in their process, and the image's OpenSSL is linked by nothing the preset runs. Re-read 2026-11-19 against the scan of goreleaser/goreleaser:v2.20.2, member by member; every one is HIGH, none is in KEV, and neither scanner reports a fix for any of them. The decision this one replaces also carried openssl CVE-2026-14456, zlib CVE-2026-85091, pcre2 CVE-2026-89157 and -89161 and c-ares CVE-2026-69184: this image no longer carries any of the five, so they left the file with it. binutils 2.45.1-r1 (EPSS at most 0.006): CVE-2025-69649 and -69650 are non-terminating output loops in readelf on crafted DWARF .debug_rnglists and .debug_loclists data, CVE-2026-6846 is a denial of service in readelf on a crafted ELF, and CVE-2026-3441 and -3442 are heap out-of-bounds reads in the BFD linker's XCOFF reader; each needs a person to run readelf or ld on a hostile file, no preset here does, and XCOFF is AIX's object format, which a Linux cgo build never produces. github.com/docker/docker v28.5.2+incompatible, vendored by the buildx plugin: CVE-2026-41567 (code execution through a malicious image and a compressed archive upload) and CVE-2026-42306 (a race in docker cp's mount setup letting a malicious container redirect a bind mount to a host path) are handlers of the Docker daemon, reported against the Go module that also holds the engine's code. The advisories say the fix is in Docker Engine 29.5.1, a daemon release; no version of the client module the plugin vendors is named as fixed, and the daemon this preset talks to is the host's, through the socket, not code in this image. They need a container started with attacker-chosen content, and the preset starts none. GO-2026-4887 (CVE-2026-34040, an AuthZ-plugin bypass on oversized request bodies) is the same kind of daemon-side handler, and is argued on its own because its EPSS is 0.09469, far above the 0.007 of the rest of this decision and above 95% of the catalogue (below 0.02): no AuthZ plugin runs in this image and the daemon whose plugin chain it would bypass is the host's. That score is why this review is two months and not three: at the next one, check whether goreleaser/goreleaser has been rebuilt with a buildx plugin that vendors a fixed docker module and repin instead of renewing. Re-argue if the preset starts running a daemon or a binutils tool."
  references = []

[[decisions]]
  id = "gosec-binutils-not-reached"
  repository = "ghcr.io/securego/gosec"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-02-17"
  reason = "Re-read 2026-11-19 against the scan of ghcr.io/securego/gosec:2.30.0 (binutils 2.45.1-r1), member by member; all five are HIGH, Grype reports no fix at any version (Trivy lists none of them), EPSS at most 0.006, none in KEV. The decision this one replaces also carried zlib CVE-2026-85091, pcre2 CVE-2026-89157 and -89161 and openssl CVE-2026-14456: this image no longer carries any of the four, so they left the file with it. The five are flaws in binutils programs and the BFD library: readelf (CVE-2025-69649 and -69650 are non-terminating output loops on crafted DWARF .debug_rnglists and .debug_loclists data; CVE-2026-6846 is a denial of service in readelf on a crafted ELF) and the BFD linker's XCOFF reader (CVE-2026-3441 and -3442, heap out-of-bounds reads when a crafted XCOFF object is linked). Each needs someone to run readelf or the linker on a hostile file. The preset runs gosec, which parses the repository's Go sources through go/parser and go/types, opens no binary and executes none of binutils' programs; the image carries binutils because the Go toolchain image it is built on does. Re-argue if the preset starts running a binutils tool."
  references = []

