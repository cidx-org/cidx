[[decisions]]
  id = "black-system-libraries-not-reached"
  repository = "pyfound/black"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-09-30"
  review_by = "2026-12-16"
  reason = "The vulnerable code sits in the Debian base layer of black's image and is not exercised by what its preset runs. util-linux (bsdutils; CVE-2026-76642, -78408, -78409, -78410): local privilege escalations against mount(8)'s fstab hooks and nsenter, which need an unprivileged local attacker and a privileged (SUID) helper with an authorized fstab entry. A container has no fstab, runs as an unprivileged uid, and no preset here runs mount or nsenter. libsystemd0 (CVE-2026-16742): a systemd-homed local privilege escalation; no systemd runs in a container and nothing here talks to it. perl-base (CVE-2026-82560): CPU exhaustion formatting a crafted POD document; nothing here runs pod2text or Pod::Text. glibc (CVE-2026-19499): needs an application calling strfmon or strfmon_l with right-justified width padding into a small buffer; no tool here does. zlib (CVE-2026-85091): a heap overflow in the gzFile write path (gzprintf or gzwrite after a stalled non-blocking write); the tools here reach zlib through inflate and deflate, and none writes through gzFile on a non-blocking descriptor. All are HIGH or CRITICAL with no fix at any version, EPSS at most 0.007, none in KEV (audit run 36565600041, 2026-09-29). Checked against the commands these presets run; re-argue if they start running the affected tool."
  references = []

[[decisions]]
  id = "buildpack-deps-curl-features-not-used"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-09-30"
  review_by = "2026-12-16"
  reason = "cargo-audit runs curl -sSfL on one fixed https URL and pipes it to tar. The seven curl CVEs (19931 Negotiate connection reuse, 18924 HTTP/2 server push with shared handles, 80229 pooled TLS connections outliving their handle, 80255 and 82209 cookie handling, 13608 LDAP SASL, 80230 public-key pinning with verification disabled) each need a feature that command does not use: no cookie engine, no Negotiate, no LDAP, no pinning, no server push, verification left on. Re-argue if the command ever starts using one. All are HIGH or CRITICAL with no fix at any version, EPSS at most 0.007, none in KEV (audit run 36565600041, 2026-09-29). Checked against the cargo-audit command; re-argue if they start running the affected tool."
  references = []

