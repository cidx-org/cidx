# Known Vulnerabilities
#
# Accepted HIGH/CRITICAL findings on the images the built-in preset catalogue
# runs. An entry is a judgement about a CVE in a repository, in our usage: it is
# keyed by repository and CVE, and it dies when no catalogue image carries the
# CVE any more, or when it expires — never because a tag moved.
#
# A vulnerability that is fixed upstream never belongs here: that is a question
# about the image's age, not a decision. "cidx security vuln add" refuses one.
#
# Fields:
#   cve        - CVE (or GHSA) identifier
#   repository - Affected repository, without tag or digest
#   first_seen - The reference it was first recorded against (context only)
#   severity   - HIGH or CRITICAL
#   status     - awaiting-upstream | accepted-risk | mitigated | third-party
#   added      - Date when this exception was added (YYYY-MM-DD)
#   expires    - Date to re-check (YYYY-MM-DD), typically 30-90 days
#   notes      - Explanation of why this is accepted
#   references - Links to upstream issues/PRs tracking the fix
#   decision   - The [[decisions]] entry authorizing this waiver; absent means a
#                legacy entry judged on its own expiry
#
# [[decisions]] is one reviewed exposure judgement about a repository under the
# aggregate context of every preset consuming it: id, repository, model,
# capabilities (the mechanical context it was reviewed against), requires (the
# semantic predicates it depends on), treatment, reviewed, review_by, reason,
# references. [[contexts]] records, per repository, what a review established
# that no declaration can derive: established, reviewed, basis.
# See docs/discussions/vulnerability-decision-workflow.md.
#
# Generated by "cidx security vuln add" and "cidx security vuln prune"; hand edits
# survive as long as they follow this layout.

[[contexts]]
  repository = "dhi.io/python"
  established = ["bounded-input"]
  reviewed = "2026-08-22"
  basis = "The interpreter consumes the repository's own code and tests, the dist/ the repository built, and PyPI's responses for the packages the repository pins. No preset parses content from outside the checkout and the pinned index."

[[contexts]]
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  established = ["bounded-input"]
  reviewed = "2026-08-22"
  basis = "molecule and ansible-test drive containers from the repository's own scenarios through the host socket; ansible-galaxy-publish uploads the collection built from the repository with its token. No preset parses content from outside the checkout."

[[decisions]]
  id = "ansible-dev-tools-kubectl-vendored-libraries"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "awaiting-upstream"
  reviewed = "2026-08-22"
  review_by = "2026-09-06"
  reason = "runc, containerd, docker/docker and selinux are vendored into /usr/local/bin/kubectl, which no preset invokes; the vulnerable paths need a container to be run by that binary, and kubectl runs none. Fixed versions exist at module level and reach us only when the image ships a rebuilt kubectl (v26.7.1, the current latest, does not). Decided 2026-08-22: if the review date passes with no such image, this becomes accepted-risk under the same model -- the blast radius, if inertness is wrong, includes the Docker socket and the Galaxy token -- rather than disabling seven presets over an uninvoked library."
  references = ["https://github.com/opencontainers/runc/releases/tag/v1.2.8", "https://github.com/containerd/containerd/releases/tag/v1.7.29"]

[[decisions]]
  id = "ansible-dev-tools-podman-bounded-input"
  repository = "ghcr.io/ansible/community-ansible-dev-tools"
  model = "tool-bounded-input"
  capabilities = ["docker-socket", "publishing-credential"]
  requires = ["bounded-input"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "podman is a tool a preset may run; what bounds it is the input -- the repository's own molecule scenarios -- and the socket it reaches is the host's. No fix at any version."
  references = []

[[decisions]]
  id = "dhi-docker-cli-client-plugins"
  repository = "dhi.io/docker"
  model = "inert-package"
  capabilities = ["docker-socket"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "The preset runs docker buildx build; the buildx plugin is static and the compose plugin is never invoked. The docker/docker CVEs are daemon-side handlers absent from both client plugins; the daemon is the host's. glibc is linked by the Go CLI, and the flagged paths are not the Go runtime's; the image's OpenSSL is linked by nothing the preset runs. No fix at any version."
  references = []

[[decisions]]
  id = "dhi-python-interpreter-bounded-input"
  repository = "dhi.io/python"
  model = "tool-bounded-input"
  capabilities = ["publishing-credential"]
  requires = ["bounded-input"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "tarfile and html.parser are exercised by pip on sdists and the simple index, for pip-audit and the installs python-build and pytest perform; twine reads the dist/ the repository built. The input is the repository's own code and PyPI's responses for the packages it pins; the flaws are extraction-filter bypass and CPU exhaustion, not code execution. No fix at any version."
  references = []

[[decisions]]
  id = "dhi-python-libraries-not-reached"
  repository = "dhi.io/python"
  model = "inert-package"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "The interpreter loads OpenSSL for TLS to PyPI, and CVE-2026-14456 is in the QUIC server listener, a path no client use reaches; binutils is reached only by an sdist build of an object the project's dependency tree chose. No fix at any version."
  references = []

[[decisions]]
  id = "gh-static-binary"
  repository = "maniator/gh"
  model = "inert-package"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "gh is static; the image's OpenSSL is linked by nothing the preset runs (git is present and used locally only). No fix at any version."
  references = []

[[decisions]]
  id = "goreleaser-static-binaries-and-client-plugin"
  repository = "goreleaser/goreleaser"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "goreleaser and the buildx plugin are static: the image's OpenSSL and binutils are not in their process (binutils is only reached by a cgo build the project chose). The docker/docker CVEs are daemon-side handlers reported against the client library the buildx plugin vendors; the daemon is the host's, through the socket. No fix at any version."
  references = []

[[decisions]]
  id = "rust-debian-libraries-not-reached"
  repository = "rust"
  model = "inert-package"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-08-22"
  review_by = "2026-11-18"
  reason = "perl, gzip, sqlite, tinfo, acl and the image's OpenSSL are neither linked by cargo/rustc nor invoked by any preset command (probed on the pinned digest, audit run 32557245489); glibc is linked, and the flagged paths (ns_printrr, scanf %mc, ungetwc) are not ones Rust std uses. cargo-publish's token travels through cargo's own TLS. No fix at any version."
  references = []

[[vulnerabilities]]
  cve = "CVE-2025-69720"
  repository = "buildpack-deps"
  first_seen = "buildpack-deps:trixie-curl"
  severity = "HIGH"
  status = "accepted-risk"
  added = "2026-08-20"
  expires = "2026-11-18"
  notes = "Present in the image, invoked by nothing this preset runs. A CIDX container lives for the length of one phase, exposes no service, receives no attacker-controlled input and persists nothing, so a flaw in a package no code path reaches has no way to be exercised here. No fix at any version; re-argue if the preset's command ever starts calling it."
  references = []

