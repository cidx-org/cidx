[[decisions]]
  id = "buildpack-deps-curl-cve-2026-92388"
  repository = "buildpack-deps"
  model = "tool-features-unused"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "CVE-2026-92388 (CRITICAL, curl and libcurl4t64 8.14.1-2+deb13u7, no fix at any version, EPSS 0.00699, not in KEV, first carried in the 2026-11-19 scan): after a failed FTP wildcard LIST, libcurl leaves the write callback pointing at its internal listing parser, which a reused or duplicated handle then misuses. It needs an ftp:// URL with wildcard matching (CURLOPT_WILDCARDMATCH, a library option) and a handle reused or cloned after the failure. The URL is https, the option is not set, and the handle is used once. Re-argue if the command starts using FTP."
