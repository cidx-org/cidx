  reason = "Re-read 2026-11-19 against the scan of goreleaser/goreleaser:v2.20.2, finding by finding; all five are HIGH, none is in KEV, EPSS at most 0.016, and neither scanner reports a fixed version (Grype: unknown for four, none for CVE-2026-119586; Trivy lists none). sqlite-libs 3.53.4-r0: CVE-2026-119373 (a heap overflow in FTS5 prefix queries over detail=none tables with negative rowids), CVE-2026-119374 (FTS5 secure-delete over a crafted index) and CVE-2026-119379 (sqlite3changeset_apply on a crafted changeset) each need a program that opens a database file, or applies a changeset, that somebody else supplied; CVE-2026-119586 is in the sqlite3 shell's .recover command, which needs the shell and a typed command. goreleaser, the buildx plugin and git open no SQLite database, and the image runs no sqlite3 shell. python3 3.14.10-r1, CVE-2026-119170: a regression in how FIPS algorithms are enforced by hashlib, which only affects users running OpenSSL in FIPS mode, and only Python 3.14.10; the image's OpenSSL is not configured for FIPS and no preset here runs python3 at all. Grype could not say whether a fix exists, so the review is a month out: at the next one, check the Alpine sqlite and python3 packages for newer releases and repin instead of renewing. Re-argue if the preset starts opening databases or running python3."
