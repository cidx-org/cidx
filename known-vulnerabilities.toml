[[decisions]]
  id = "golangci-lint-sqlite-not-reached"
  repository = "golangci/golangci-lint"
  model = "inert-package"
  capabilities = []
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2026-12-18"
  reason = "Re-read 2026-11-19 against the scan of golangci/golangci-lint:v2.15.0-alpine, finding by finding; all four are HIGH on sqlite-libs 3.53.4-r0, none is in KEV, EPSS at most 0.016, and neither scanner reports a fixed version (Grype: unknown for CVE-2026-119373, -119374 and -119379, none for CVE-2026-119586; Trivy lists none). CVE-2026-119373 (a heap overflow in FTS5 prefix queries over detail=none tables with negative rowids), CVE-2026-119374 (FTS5 secure-delete over a crafted index) and CVE-2026-119379 (sqlite3changeset_apply on a crafted changeset) each need a program that opens a database file, or applies a changeset, that somebody else supplied. CVE-2026-119586 is in the sqlite3 shell's .recover command, which emits dot-commands planted in a database's schema into a script a person pipes back to the shell: it needs the shell and a typed command. The preset runs golangci-lint over the repository's Go sources and opens no database; the image runs no sqlite3 shell. Grype could not say whether a fix exists, so the review is a month out: at the next one, check the Alpine sqlite package for a release past 3.53.4-r0 and repin instead of renewing. Re-argue if the preset starts opening databases."
  references = []

[[decisions]]
  id = "goreleaser-sqlite-and-python-not-reached"
  repository = "goreleaser/goreleaser"
  model = "inert-package"
  capabilities = ["docker-socket", "publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
