[[decisions]]
  id = "rust-debian-libraries-not-reached"
  repository = "rust"
  model = "inert-package"
  capabilities = ["publishing-credential"]
  treatment = "accepted-risk"
  reviewed = "2026-11-19"
  review_by = "2027-01-18"
  reason = "The vulnerable code sits in the Debian base layer of the Rust image and is not exercised by what its presets run: cargo and rustc compile the repository's own crates (cargo-publish also sends its token through cargo's own TLS client to the registry), fetch crates and rustup components as a TLS client over TCP, and run no server and no other program of the base layer. Re-read 2026-11-19 against a fresh Trivy and Grype scan of the pinned digest (rust:1.97.1-slim), member by member; every member below is HIGH, has no fix in either scanner (wont-fix, not-fixed, affected or fix_deferred), and has EPSS at most 0.0063. Members whose fix has since been published (perl, gzip, sqlite, glibc and OpenSSL updates, among them CVE-2026-72897, -84782, -84784 and zlib CVE-2026-85091 that this decision used to carry) were removed from it: they are a repin, not a decision. The first review found perl, tinfo, acl and OpenSSL neither linked by cargo/rustc nor invoked by any preset command (probed on the pinned digest, audit run 32557245489); that is the premise the arguments below rest on, and it is re-argued from each flaw's own description rather than assumed. util-linux (bsdutils and its libraries; CVE-2026-76642, -78408, -78409, -78410): local privilege escalations against mount(8)'s fstab hooks and nsenter, which need an unprivileged local attacker and a privileged (SUID) helper with an authorized fstab entry. A container has no fstab, runs as an unprivileged uid, and no preset here runs mount or nsenter. libsystemd0 and libudev1 (CVE-2026-16742): a systemd-homed local privilege escalation; no systemd runs in a container and nothing here talks to it. perl-base: CVE-2026-82560 is CPU exhaustion formatting a crafted POD document, and nothing here runs pod2text or Pod::Text; CVE-2026-9538 is memory exhaustion in Archive::Tar from an attacker-chosen entry size in a tar header, and no preset runs perl, let alone Archive::Tar on a tar file (crates are unpacked by cargo's own Rust code). glibc is linked, so each flagged path was read: CVE-2026-19499 needs an application calling strfmon or strfmon_l with right-justified width padding into a small buffer, which Rust std does not; CVE-2026-5435 is an out-of-bounds write in the deprecated resolver printers ns_printrr, ns_printrrf and fp_nquery when printing TSIG records, and neither cargo nor rustc prints DNS resource records; CVE-2026-84243 lets whoever controls LANGUAGE (and a second locale variable) in a program's environment load a message catalog from an arbitrary path, and needs a crafted .mo file where the program can read it and an environment crossing a trust boundary, as an SSH server accepting client variables does; here the runner sets the environment, and the only writable input is the repository's own checkout, which is also what cargo-publish uploads with its token. ncurses (CVE-2025-69720; libtinfo6, ncurses-base, ncurses-bin): the overflow is in the infocmp command-line tool (analyze_string in progs/infocmp.c), and no preset runs infocmp. libacl1 (CVE-2026-54369, -54370): symlink traversal and a check-then-use race in libacl's pathname functions and in getfacl, setfacl and chacl, which matter only to a privileged caller working over a path an attacker controls; the presets run unprivileged over the user's own checkout and call none of them. SQLite (libsqlite3-0; CVE-2026-119373, -119374, -119379): heap overflows in FTS5 prefix queries on detail=none tables with negative rowids, in FTS5 secure-delete on a crafted index, and in sqlite3changeset_apply on a crafted changeset; each needs a program that opens a database through the Debian library, and nothing the presets run does (the first review of this decision probed the pinned digest and found sqlite neither linked by cargo/rustc nor invoked). OpenSSL (libssl3t64, openssl, openssl-provider-legacy), reached only as a TLS client over TCP: CVE-2026-107493 needs an application passing a non-NULL stack to PEM_X509_INFO_read_bio_ex and reusing it after a failed read, which OpenSSL's own callers never do and nothing here calls. CVE-2026-107496 needs CMS_encrypt to an EC recipient certificate of group order 1, and nothing here encrypts CMS messages. CVE-2026-88823 and CVE-2026-95692 concern AES-GCM-SIV (a zero-length AAD update, a wrong-length IV), an algorithm only the default provider offers, that TLS never selects and no tool here uses. CVE-2026-124709 is a memory leak in a QUIC server that rejects a stream and CVE-2026-95691 a use-after-free in a QUIC client fed by a malicious QUIC server; no preset runs a QUIC server or speaks QUIC (cargo and rustup use HTTP over TLS on TCP). gcc and libstdc++ (cpp-14, gcc-14, gcc-14-base, libgcc-s1, libstdc++6 and the sanitizer runtimes): the image ships the C toolchain as cargo's linker driver. CVE-2026-102010 is a use-after-free in erase_if on libstdc++'s pb_ds binary-heap priority queue, a header-only template instantiated into an application at build time, so these packages hold none of it at run time; it needs a C++ program built with it that calls erase_if. CVE-2026-95619 is an integer overflow in the aligned operator new, which needs a C++ program asking for an attacker-sized aligned allocation; a Rust build does not use libstdc++ unless the repository's own build script compiles C++ from its own sources, and what such a program allocates is not chosen by an attacker. Re-argue if a preset starts running any of the affected tools, compiles C++ that handles untrusted input, or opens QUIC or server sockets."
  references = []

