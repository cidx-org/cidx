name: Container Monitor

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute targets and scan, but do not open a promotion PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Get deduplicated scan targets (new version if available, else current)
  get-scan-targets:
    name: Get Scan Targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      scan_images: ${{ steps.targets.outputs.scan_images }}
      count: ${{ steps.targets.outputs.count }}
      has_updates: ${{ steps.targets.outputs.has_updates }}
      missing: ${{ steps.targets.outputs.missing }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      # dhi.io answers no anonymous token, so its tag listings and its manifest
      # lookups need the same login the scan jobs perform (#245).
      - name: Login to Docker Hardened Images
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get scan targets
        id: targets
        run: |
          # Get deduplicated scan targets with update detection
          TARGETS_JSON=$(./bin/cidx preset scan-targets)

          # Extract just the scan_image array for matrix
          SCAN_IMAGES=$(echo "$TARGETS_JSON" | jq -c '[.[].scan_image]')
          COUNT=$(echo "$SCAN_IMAGES" | jq 'length')
          HAS_UPDATES=$(echo "$TARGETS_JSON" | jq 'any(.is_update == true)')

          # Save full targets for promote job
          echo "targets<<EOF" >> $GITHUB_OUTPUT
          echo "$TARGETS_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # A pinned image the registry answers 404 for: the preset cannot run
          # at all, and until #245 that only surfaced when someone ran it.
          MISSING=$(echo "$TARGETS_JSON" | jq -r '[.[] | select(.missing == true)] | length')

          echo "scan_images=$SCAN_IMAGES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "has_updates=$HAS_UPDATES" >> $GITHUB_OUTPUT
          echo "missing=$MISSING" >> $GITHUB_OUTPUT

          echo "## Scan Targets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Found **$COUNT** unique images to scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Candidates cleared for promotion: either past the 14-day cooldown,
          # or waived out of it because the running image is knowingly
          # vulnerable. policy_reason says which (#242).
          UPDATES=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.is_update == true) | "- \(.current_image) → \(.scan_image) — \(.policy_reason)"')
          if [ -n "$UPDATES" ]; then
            echo "### Updates Available" >> $GITHUB_STEP_SUMMARY
            echo "$UPDATES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Candidates the cooldown holds back, or that could not be dated.
          # Reported rather than dropped: the current image keeps being scanned
          # and run in the meantime, and the candidate returns next week.
          HELD=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.candidate_image != null and .is_update == false) | "- \(.current_image) → \(.candidate_image) — \(.policy_reason)"')
          if [ -n "$HELD" ]; then
            echo "### Held by the cooldown" >> $GITHUB_STEP_SUMMARY
            echo "$HELD" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Versions found on a registry that dates none of its tags. They are
          # deliberately not candidates: the cooldown could never be shown to
          # have elapsed, so they would be held for ever (#245).
          UNDATABLE=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.newer_version != null) | "- \(.current_image) → \(.newer_version) — \(.policy_reason)"')
          if [ -n "$UNDATABLE" ]; then
            echo "### Newer version, not promotable automatically" >> $GITHUB_STEP_SUMMARY
            echo "$UNDATABLE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # An image that no longer exists upstream. Annotated as an error so it
          # is visible on the run itself, and re-raised by the summary job.
          GONE=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.missing == true) | "\(.current_image) (used by \(.presets | join(", "))): \(.error)"')
          if [ -n "$GONE" ]; then
            echo "### Missing images" >> $GITHUB_STEP_SUMMARY
            echo "$GONE" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$GONE" | while read -r line; do echo "::error::$line"; done
          fi

          # A variant line the repository stopped publishing altogether. The
          # image still pulls, so it is not missing — it just will never get
          # another fix, which "up to date" used to hide (#252).
          FROZEN=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.frozen_variant != null) | "- \(.current_image) — \(.policy_reason)"')
          if [ -n "$FROZEN" ]; then
            echo "### Frozen variant line" >> $GITHUB_STEP_SUMMARY
            echo "$FROZEN" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$TARGETS_JSON" | jq -r '.[] | select(.frozen_variant != null) | "::warning::frozen variant line: \(.current_image) — \(.policy_reason)"'
          fi

          # A pinned tag that is a name rather than a version. Nothing a
          # registry lists can ever be newer than it, so this image is outside
          # the promotion path: its updates arrive as rebuilds of the same tag
          # under a new digest, which nothing here detects (#328). Listed rather
          # than annotated — it is a standing property of the pin, not an event,
          # and a weekly warning that never resolves is one nobody reads.
          UNVERSIONED=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.unversioned_tag == true) | "- \(.current_image) — \(.policy_reason)"')
          if [ -n "$UNVERSIONED" ]; then
            echo "### Tag carries no version" >> $GITHUB_STEP_SUMMARY
            echo "$UNVERSIONED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Show current (nothing newer found)
          CURRENT=$(echo "$TARGETS_JSON" | jq -r '.[] | select(.is_update == false and .candidate_image == null and .newer_version == null and .frozen_variant == null and .unversioned_tag == null) | "- \(.scan_image)"')
          if [ -n "$CURRENT" ]; then
            echo "### Current (no updates)" >> $GITHUB_STEP_SUMMARY
            echo "$CURRENT" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Trivy scan (parallel matrix)
  trivy-scan:
    name: Trivy
    needs: get-scan-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.get-scan-targets.outputs.scan_images) }}

    steps:
      # Only when the image under scan is actually a hardened one. Every leg
      # used to log in regardless, so a transient dhi.io failure killed a leg
      # scanning a docker.io image — and since promote depends on the scan jobs,
      # that unrelated flake blocked every promotion of the cycle (#254).
      - name: Login to Docker Hardened Images
        if: startsWith(matrix.image, 'dhi.io/')
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The scan reports; it does not judge. It deliberately exits 0 on a
      # finding, because several catalogue images are knowingly vulnerable
      # (known-vulnerabilities.toml) and failing here would leave the monitor
      # permanently red. What used to be wrong is that nothing judged
      # afterwards: the promote job read needs.trivy-scan.result, which is
      # `success` by construction (#247). The findings are now kept, and the
      # promote job turns them into a per-candidate verdict.
      - name: Scan with Trivy
        run: |
          IMAGE="${{ matrix.image }}"
          echo "Scanning: $IMAGE"
          mkdir -p results

          # The file name is the whole contract with `cidx preset
          # scan-verdicts`; TestScanResultFileMatchesTheWorkflowConvention pins
          # this transform. stdout only: stderr would corrupt the JSON, and a
          # corrupt result holds the candidate rather than reading as clean.
          # The login above wrote its credentials into the runner's docker
          # config; the scanner runs in a container that never saw it, so it
          # pulled anonymously and dhi.io answered 401 (#284). Mounted read-only,
          # with DOCKER_CONFIG pointing at it: credentials stay keyed by registry
          # under `auths`, so only dhi.io receives them — TRIVY_USERNAME would
          # also be offered to ghcr.io, where this job fetches its database.
          OUT="results/trivy-$(echo "$IMAGE" | tr '/:@' '___').json"
          docker run --rm \
            -v "$HOME/.docker:/docker-config:ro" \
            -e DOCKER_CONFIG=/docker-config \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --quiet \
            --format json \
            "$IMAGE" > "$OUT" || true

          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$OUT" 2>/dev/null || echo "unreadable")
          echo "Trivy $IMAGE: $COUNT HIGH/CRITICAL finding(s) recorded for the promotion verdict"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-scan-${{ strategy.job-index }}
          path: results/
          retention-days: 1

  # Job 3: Grype scan (parallel matrix)
  grype-scan:
    name: Grype
    needs: get-scan-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.get-scan-targets.outputs.scan_images) }}

    steps:
      # Same reasoning as the Trivy job: log in only for the registry the image
      # under scan belongs to (#254).
      - name: Login to Docker Hardened Images
        if: startsWith(matrix.image, 'dhi.io/')
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same posture as the Trivy job: report the findings, leave the verdict to
      # the promote job (#247).
      - name: Scan with Grype
        run: |
          IMAGE="${{ matrix.image }}"
          echo "Scanning: $IMAGE"
          mkdir -p results

          # Same credential path as the Trivy job (#284).
          OUT="results/grype-$(echo "$IMAGE" | tr '/:@' '___').json"
          docker run --rm \
            -v "$HOME/.docker:/docker-config:ro" \
            -e DOCKER_CONFIG=/docker-config \
            anchore/grype:latest \
            "$IMAGE" \
            --quiet \
            -o json > "$OUT" || true

          # Grype reports every severity whatever --fail-on says, so the count
          # here is filtered the same way the verdict filters it.
          COUNT=$(jq '[.matches[]? | select(.vulnerability.severity | ascii_upcase | IN("HIGH","CRITICAL"))] | length' "$OUT" 2>/dev/null || echo "unreadable")
          echo "Grype $IMAGE: $COUNT HIGH/CRITICAL finding(s) recorded for the promotion verdict"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-scan-${{ strategy.job-index }}
          path: results/
          retention-days: 1

  # Job 4: Promote updates that passed scans
  promote:
    name: Promote Updates
    needs: [get-scan-targets, trivy-scan, grype-scan]
    # Runs even when a scan job failed, because the verdict is per candidate:
    # the very first end-to-end run of this gate lost one Trivy leg to a flaky
    # registry login, and letting that skip the whole job would block every
    # unrelated promotion — the coarse, always-stuck gate #247 replaced. A
    # candidate whose results are missing is held on its own; the others are
    # judged on the evidence that does exist, and the verdict names the scanners
    # it actually read.
    if: >-
      !cancelled()
      && needs.get-scan-targets.result == 'success'
      && needs.get-scan-targets.outputs.has_updates == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      # The findings every scan job kept. Without them no candidate can be shown
      # to be safe, and the verdict below holds all of them — fail-closed.
      #
      # continue-on-error covers the case where every scan job died and there is
      # nothing to download: those jobs already turned the run red, and failing
      # here on top would only cost the report of what was held and why.
      - name: Download scan results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: scan-results
          pattern: "*-scan-*"
          merge-multiple: true

      - name: Check scan results and promote
        id: promote
        env:
          TARGETS_JSON: ${{ needs.get-scan-targets.outputs.targets }}
        run: |
          echo "## Promotion Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # The scan gate, per candidate and differential: what the scanners
          # found on the candidate, minus what is already accepted for the image
          # we run today (#247). The decision lives in Go, where it is tested —
          # this step only reads the verdict, as the cooldown did in #242.
          VERDICTS=$(echo "$TARGETS_JSON" | ./bin/cidx preset scan-verdicts --results scan-results)
          echo "$VERDICTS" | jq -r '.[] | "\(.new_image): promote=\(.promote) — \(.reason)"'

          # Only candidates that cleared both gates: the cooldown and its CVE
          # exception in `cidx preset scan-targets` (#242), then the scan gate
          # above.
          echo "$VERDICTS" | jq -c '.[] | select(.promote == true)' | while read -r verdict; do
            CURRENT=$(echo "$verdict" | jq -r '.current_image')
            NEW=$(echo "$verdict" | jq -r '.new_image')
            PRESETS=$(echo "$verdict" | jq -r '.presets | join(", ")')
            POLICY=$(echo "$verdict" | jq -r '.policy_reason // "no policy verdict"')
            SCAN=$(echo "$verdict" | jq -r '.reason')

            echo "Promoting: $CURRENT → $NEW (used by: $PRESETS) — $POLICY; $SCAN"

            # Update presets.toml. `new_image` is already digest-pinned
            # (image:tag@sha256:..., issue #242) — cidx preset scan-targets
            # resolves the candidate's digest and reports an error instead of
            # an update when it cannot, so a promotion can never write back a
            # mutable tag. The "Test build" step below re-checks the invariant.
            sed -i "s|image = \"$CURRENT\"|image = \"$NEW\"|g" pkg/presets/presets.toml

            echo "- **$CURRENT** → **$NEW** (presets: $PRESETS) — $POLICY; $SCAN" >> $GITHUB_STEP_SUMMARY
            echo $(($(cat /tmp/promoted_count 2>/dev/null || echo 0) + 1)) > /tmp/promoted_count
          done

          PROMOTED=$(cat /tmp/promoted_count 2>/dev/null || echo 0)

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total promoted: $PROMOTED**" >> $GITHUB_STEP_SUMMARY

          # A candidate the scan gate holds is information, not a broken
          # workflow: it is annotated and reported, and the run stays green. Red
          # is kept for what is actually broken — a catalogue image that no
          # longer exists (#245) — so it keeps meaning something.
          HELD=$(echo "$VERDICTS" | jq -r '.[] | select(.promote == false) | "- `\(.current_image)` → `\(.new_image)` — \(.reason)"')
          if [ -n "$HELD" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Held by the scan gate" >> $GITHUB_STEP_SUMMARY
            echo "$HELD" >> $GITHUB_STEP_SUMMARY
            echo "$VERDICTS" | jq -r '.[] | select(.promote == false) | "::warning::promotion held: \(.new_image) — \(.reason)"'
          fi

          # What the promotion PR may claim about security, stated per image
          # rather than as an overall job result that was always `success`.
          CLEARED=$(echo "$VERDICTS" | jq -r '.[] | select(.promote == true) | "- `\(.new_image)` — \(.reason)"')
          if [ -z "$CLEARED" ]; then
            CLEARED="_None._"
          fi
          {
            echo "scan_report<<SCAN_EOF"
            echo "$CLEARED"
            echo "SCAN_EOF"
          } >> $GITHUB_OUTPUT

          # Rule 3 requires the waiver to be visible in the promotion PR:
          # which vulnerability, on which image, fixed by which version. Only
          # for candidates actually promoted — a waiver claimed for a candidate
          # the scan gate then held would be a claim about nothing.
          WAIVERS=$(echo "$VERDICTS" | jq -r '.[] | select(.promote == true and .cve_waiver != null) | "- `\(.current_image)` is affected by \(.cve_waiver | join(", ")) — promoted to `\(.new_image)` without waiting out the cooldown"')
          if [ -z "$WAIVERS" ]; then
            WAIVERS="_None: every promoted version served the full 14-day cooldown._"
          fi
          {
            echo "waivers<<WAIVERS_EOF"
            echo "$WAIVERS"
            echo "WAIVERS_EOF"
          } >> $GITHUB_OUTPUT

          # Check for changes
          if git diff --quiet pkg/presets/presets.toml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo ""
            echo "Changes:"
            git diff pkg/presets/presets.toml
          fi

      # go test ./pkg/... includes TestCatalogueImagesArePinnedByDigest, the
      # standing guard for rule 1 of the image supply-chain policy: if a
      # promotion ever wrote a bare tag back into presets.toml, this fails and
      # no PR is opened.
      - name: Test build
        if: steps.promote.outputs.has_changes == 'true'
        run: |
          go build -o bin/cidx ./cmd/cidx
          go test ./pkg/... ./cmd/...
          ./bin/cidx preset list > /dev/null
          echo "Build and tests passed" >> $GITHUB_STEP_SUMMARY

      # A manual run is how the promotion policy gets exercised end to end, and
      # it must not leave a stray PR behind to do it. The scheduled run leaves
      # inputs empty, so it is never a dry run.
      - name: Report dry run
        if: steps.promote.outputs.has_changes == 'true' && inputs.dry_run
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run**: the promotion above was computed and applied to the working tree, but no version bump and no pull request were made." >> $GITHUB_STEP_SUMMARY

      - name: Bump version
        if: steps.promote.outputs.has_changes == 'true' && !inputs.dry_run
        id: bump
        run: |
          pip install commitizen
          CURRENT=$(cz version --project 2>/dev/null || echo "0.0.0")
          cz bump --yes --increment PATCH --changelog 2>&1 || true
          NEW=$(cz version --project 2>/dev/null || echo "unknown")
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "**Version: $CURRENT → $NEW**" >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request
        if: steps.promote.outputs.has_changes == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # What a promotion legitimately touches: the image bump itself, and
          # whatever `cz bump --changelog` rewrites above (version_files in
          # .cz.toml, plus the changelog). Everything else in this workspace is
          # not part of the promotion.
          #
          # Naming them is the point. The action's default is "commit whatever
          # is dirty", and this job is dirty by construction — it downloads
          # every scan artifact into scan-results/ to reach its verdict. That
          # default swept 43 files and 201,615 lines of scanner JSON into the
          # promotion PR (#323), and because gitleaks scans *every* ref, the
          # Security job of every branch in the repository then failed on
          # findings that lived entirely in that one foreign commit. #324 put
          # scan-results/ in .gitignore, which closes that hole; it does not
          # close the next one, because the next artifact directory will not be
          # in .gitignore on the day it is added. An allowlist is closed by
          # default, so it stays closed.
          add-paths: |
            pkg/presets/presets.toml
            CHANGELOG.md
            VERSION
            .cz.toml
          commit-message: "chore(deps): update container images to ${{ steps.bump.outputs.new_version }}"
          title: "chore(deps): update container images → ${{ steps.bump.outputs.new_version }}"
          body: |
            ## Container Image Updates

            This PR updates container images in `pkg/presets/presets.toml`.

            **Version: `${{ steps.bump.outputs.new_version }}`**

            ### Supply-chain policy (#242)

            Every version below is pinned by digest (rule 1) and has been
            publicly available for at least 14 days (rule 2), unless it appears
            under the waivers.

            #### Cooldown waivers (rule 3)

            ${{ steps.promote.outputs.waivers }}

            ### Security validation (#247)

            Trivy and Grype scanned every version below. Each was promoted
            because it introduces no HIGH/CRITICAL finding beyond what is
            already accepted for the image it replaces
            (`known-vulnerabilities.toml`):

            ${{ steps.promote.outputs.scan_report }}

            Candidates that did introduce one are held back, and named in the
            run summary under *Held by the scan gate*.

            See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            Generated by Container Monitor
          branch: chore/update-containers
          delete-branch: true

  # Job 5: Summary (runs even if no updates)
  summary:
    name: Summary
    needs: [get-scan-targets, trivy-scan, grype-scan, promote]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Container Monitor Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Targets | ${{ needs.get-scan-targets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scans | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Grype Scans | ${{ needs.grype-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Promotion | ${{ needs.promote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images scanned: **${{ needs.get-scan-targets.outputs.count }}**" >> $GITHUB_STEP_SUMMARY
          echo "Updates available: **${{ needs.get-scan-targets.outputs.has_updates }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # The scanner rows say the scans ran, not that the images are clean —
          # reading them as a verdict is the mistake #247 was about. The verdicts
          # are per candidate, in the Promotion Report above.
          echo "The scanner rows report that the scans ran. What they found is weighed per candidate in the promotion report (#247)." >> $GITHUB_STEP_SUMMARY

      # A catalogue image deleted upstream breaks every preset using it, so the
      # weekly run goes red rather than reporting it in a summary nobody opens
      # (#245). It runs last so the scans and the promotion happen first.
      - name: Fail on missing images
        if: needs.get-scan-targets.outputs.missing != '0' && needs.get-scan-targets.outputs.missing != ''
        run: |
          echo "${{ needs.get-scan-targets.outputs.missing }} catalogue image(s) no longer exist upstream — see the Scan Targets summary"
          exit 1
