name: CIDX Release

on:
  push:
    tags: ["v*"]

jobs:
  # Build: Cross-compile for all platforms
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.Version=$VERSION"
          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cidx-linux-amd64 ./cmd/cidx
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/cidx-linux-arm64 ./cmd/cidx

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cidx-darwin-amd64 ./cmd/cidx
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/cidx-darwin-arm64 ./cmd/cidx

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cidx-windows-amd64.exe ./cmd/cidx

          # Default binary for backward compat
          cp dist/cidx-linux-amd64 dist/cidx

          # Checksums
          cd dist && sha256sum cidx-* > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cidx-binaries
          path: dist/
          # Inter-job handoff only (build -> docker/release); the release job
          # attaches the binaries to the GitHub Release, which is permanent.
          retention-days: 1

  # Docker: Build and push container image
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binaries
          path: dist/

      - name: Prepare binary
        run: |
          mkdir -p bin
          cp dist/cidx-linux-amd64 bin/cidx
          chmod +x bin/cidx

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: ./bin/cidx run docker
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release: Create GitHub Release with all binaries
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binaries
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/cidx-linux-amd64
            dist/cidx-linux-arm64
            dist/cidx-darwin-amd64
            dist/cidx-darwin-arm64
            dist/cidx-windows-amd64.exe
            dist/checksums.txt
