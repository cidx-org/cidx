# Throwaway: proves the cidx-bot App credentials mint a usable token.
# Never merged — the PR carrying it is closed once it has answered.
name: App Token Check

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CIDX_BOT_APP_ID }}
          private-key: ${{ secrets.CIDX_BOT_PRIVATE_KEY }}

      # Prints what the token can reach, never the token.
      - name: Ask GitHub who this token is
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "Repositories this installation reaches:"
          gh api /installation/repositories --jq '.repositories[].full_name'
          echo "Permissions:"
          gh api /installation/repositories --jq '.repositories[0].permissions'
