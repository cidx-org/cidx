name: Security Audit

on:
  schedule:
    # Run daily at 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

# The floor every job starts from, so that the two jobs needing more have to say
# so and the rest cannot. #301 granted `security-events: write` to the `report`
# job alone and #308 grants it `issues: write`; without this block the other
# four would inherit whatever the repository's default happens to be, and the
# job-level grants would restrict nothing. A job that declares `permissions:`
# replaces this entirely rather than adding to it, which is why `report`
# restates `contents: read`.
permissions:
  contents: read

env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
  GRYPE_DB_AUTO_UPDATE: false

jobs:
  # Job 1: Get unique images and setup databases
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
      count: ${{ steps.images.outputs.count }}
      trivy-cache-key: ${{ steps.cache-keys.outputs.trivy }}
      grype-cache-key: ${{ steps.cache-keys.outputs.grype }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      - name: Get unique images
        id: images
        run: |
          # --catalogue: the audit governs the images presets.toml ships, not
          # the ones a checked-out project's own presets happen to add (#248).
          IMAGES=$(./bin/cidx preset images --catalogue --json | jq -c '[.[].image]')
          COUNT=$(echo "$IMAGES" | jq 'length')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Generate cache keys
        id: cache-keys
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "trivy=trivy-db-$DATE" >> $GITHUB_OUTPUT
          echo "grype=grype-db-$DATE" >> $GITHUB_OUTPUT

      - name: Cache Trivy DB
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ steps.cache-keys.outputs.trivy }}
          restore-keys: trivy-db-

      - name: Download Trivy DB
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/trivy/db
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:latest image --download-db-only
          sudo chown -R $USER:$USER ~/.cache/trivy

      - name: Cache Grype DB
        id: grype-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype
          key: ${{ steps.cache-keys.outputs.grype }}
          restore-keys: grype-db-

      - name: Download Grype DB
        if: steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/grype/db
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -e GRYPE_DB_CACHE_DIR=/root/.cache/grype/db \
            anchore/grype:latest db update
          sudo chown -R $USER:$USER ~/.cache/grype

  # Job 2: Trivy scan (parallel)
  trivy-scan:
    name: Trivy
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Login to DHI, and only for the legs that scan a hardened image: a leg
      # scanning docker.io has no business dying of a dhi.io outage (#254).
      - name: Login to Docker Hardened Images
        if: startsWith(matrix.image, 'dhi.io/')
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      # Read-only restore: setup already populated this exact key in this run,
      # so a save here would be a no-op that races across matrix jobs.
      - name: Restore Trivy DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ needs.setup.outputs.trivy-cache-key }}
          restore-keys: trivy-db-
          fail-on-cache-miss: true

      - name: Generate ignore file
        run: |
          IMAGE="${{ matrix.image }}"
          ./bin/cidx security vuln ignore --format trivy -o .trivyignore "$IMAGE"

      - name: Scan and save results
        id: scan
        run: |
          IMAGE="${{ matrix.image }}"
          SAFE_NAME=$(echo "$IMAGE" | tr '/:' '_')
          mkdir -p results

          # The login step above wrote the dhi.io credentials into the *runner's*
          # ~/.docker/config.json. Trivy runs in a container that saw neither that
          # file nor the daemon socket, so it re-pulled every image itself, as an
          # anonymous client — which passes on public registries and answered 401
          # on all five hardened images. A quarter of the catalogue had no
          # evidence at all, and that pinned 122 exceptions in `unknown` where
          # `cidx security vuln prune` can never resolve them (#284).
          #
          # The config is mounted read-only and DOCKER_CONFIG points at it, the
          # form both scanners document for running in a container. Credentials
          # stay keyed by registry under `auths`, so only dhi.io ever receives
          # them; TRIVY_USERNAME/TRIVY_PASSWORD would be offered to every
          # registry Trivy contacts, including the one hosting its own database.
          #
          # Not the docker socket: the catalogue references are digest-pinned
          # (rule 1 of the supply-chain policy), so a registry fetch resolves the
          # exact bytes a local pull would — there is no tag re-resolution to
          # guard against, and no reason to hand the scanner root on the runner.
          DOCKER_AUTH=(-v "$HOME/.docker:/docker-config:ro" -e DOCKER_CONFIG=/docker-config)

          # Run scan and capture output (don't fail yet).
          #
          # stderr is dropped rather than merged: `2>&1` here put docker's own
          # "Pulling from ..." progress at the head of every .json this job
          # uploaded, so the artifacts parsed as JSON nowhere — including in
          # `cidx security vuln prune`, which reads exactly these files to decide
          # whether an accepted CVE is still present (#238). The .txt capture
          # below still keeps stderr, which is where the auth check reads it.
          docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.trivyignore:/root/.trivyignore:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignorefile /root/.trivyignore \
            --skip-db-update \
            --format json \
            "$IMAGE" > results/trivy-${SAFE_NAME}.json 2>/dev/null || true

          # Also get table format for display
          docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.trivyignore:/root/.trivyignore:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignorefile /root/.trivyignore \
            --skip-db-update \
            "$IMAGE" > results/trivy-${SAFE_NAME}.txt 2>&1 || true

          # Check for auth failures (private registry). Reported here, failed in
          # the step after the upload so the evidence is kept either way.
          if grep -q "UNAUTHORIZED\|401 Unauthorized\|authentication required" results/trivy-${SAFE_NAME}.txt 2>/dev/null; then
            echo "❌ $IMAGE was not scanned - the registry refused the credentials"
            echo "status=auth_required" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if vulnerabilities found
          if docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.trivyignore:/root/.trivyignore:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignorefile /root/.trivyignore \
            --skip-db-update \
            --exit-code 1 \
            --quiet \
            "$IMAGE" 2>/dev/null; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=vulnerable" >> $GITHUB_OUTPUT
          fi

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ strategy.job-index }}
          path: results/
          retention-days: 1

      # An image the scanner could not authenticate to yields no findings, and no
      # findings must never read as clean. The previous "⚠️ Skipping" left the leg
      # green, which is how five hardened images went unscanned for months
      # without anyone noticing (#284). Same posture as the step below: the
      # artifacts are uploaded first, then the leg fails.
      - name: Fail if unscannable
        if: steps.scan.outputs.status == 'auth_required'
        run: |
          echo "❌ ${{ matrix.image }} was not scanned - the registry refused the credentials"
          echo "   The audit has no evidence for this image, so the exceptions"
          echo "   recorded against it can never be shown to be obsolete."
          exit 1

      - name: Fail if vulnerable
        if: steps.scan.outputs.status == 'vulnerable'
        run: |
          echo "❌ Unhandled vulnerabilities found in ${{ matrix.image }}"
          echo "   Add exceptions with: cidx security vuln add <CVE> ${{ matrix.image }}"
          exit 1

  # Job 3: Grype scan (parallel)
  grype-scan:
    name: Grype
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Same as the Trivy job: only the legs that scan a hardened image (#254).
      - name: Login to Docker Hardened Images
        if: startsWith(matrix.image, 'dhi.io/')
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      # Read-only restore: setup already populated this exact key in this run,
      # so a save here would be a no-op that races across matrix jobs.
      # GRYPE_DB_AUTO_UPDATE is false, so fail loudly rather than scan blind.
      - name: Restore Grype DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype
          key: ${{ needs.setup.outputs.grype-cache-key }}
          restore-keys: grype-db-
          fail-on-cache-miss: true

      - name: Generate ignore file
        run: |
          IMAGE="${{ matrix.image }}"
          ./bin/cidx security vuln ignore --format grype -o .grype.yaml "$IMAGE"

      - name: Scan and save results
        id: scan
        run: |
          IMAGE="${{ matrix.image }}"
          SAFE_NAME=$(echo "$IMAGE" | tr '/:' '_')
          mkdir -p results

          # Same as the Trivy job: the runner's registry credentials, mounted
          # read-only and pointed at with DOCKER_CONFIG, which Grype's image
          # layer honours the same way (#284).
          DOCKER_AUTH=(-v "$HOME/.docker:/docker-config:ro" -e DOCKER_CONFIG=/docker-config)

          # Same as the Trivy job: stderr stays out of the JSON, which was
          # otherwise headed by docker's pull progress and parsed nowhere (#238).
          docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.grype.yaml:/.grype.yaml:ro" \
            -v "$HOME/.cache/grype:/root/.cache/grype:ro" \
            -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/root/.cache/grype/db \
            anchore/grype:latest \
            "registry:$IMAGE" \
            --config /.grype.yaml \
            -o json > results/grype-${SAFE_NAME}.json 2>/dev/null || true

          # Also get table format
          docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.grype.yaml:/.grype.yaml:ro" \
            -v "$HOME/.cache/grype:/root/.cache/grype:ro" \
            -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/root/.cache/grype/db \
            anchore/grype:latest \
            "registry:$IMAGE" \
            --config /.grype.yaml > results/grype-${SAFE_NAME}.txt 2>&1 || true

          # Check for auth failures (private registry). Reported here, failed in
          # the step after the upload so the evidence is kept either way.
          if grep -q "UNAUTHORIZED\|401 Unauthorized\|authentication required" results/grype-${SAFE_NAME}.txt 2>/dev/null; then
            echo "❌ $IMAGE was not scanned - the registry refused the credentials"
            echo "status=auth_required" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if vulnerabilities found
          if docker run --rm \
            "${DOCKER_AUTH[@]}" \
            -v "$(pwd)/.grype.yaml:/.grype.yaml:ro" \
            -v "$HOME/.cache/grype:/root/.cache/grype:ro" \
            -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/root/.cache/grype/db \
            anchore/grype:latest \
            "registry:$IMAGE" \
            --config /.grype.yaml \
            --fail-on high \
            -q 2>/dev/null; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=vulnerable" >> $GITHUB_OUTPUT
          fi

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-${{ strategy.job-index }}
          path: results/
          retention-days: 1

      # Same as the Trivy job: an unscannable image is a hole in the evidence,
      # not a skip to shrug at (#284).
      - name: Fail if unscannable
        if: steps.scan.outputs.status == 'auth_required'
        run: |
          echo "❌ ${{ matrix.image }} was not scanned - the registry refused the credentials"
          echo "   The audit has no evidence for this image, so the exceptions"
          echo "   recorded against it can never be shown to be obsolete."
          exit 1

      - name: Fail if vulnerable
        if: steps.scan.outputs.status == 'vulnerable'
        run: |
          echo "❌ Unhandled vulnerabilities found in ${{ matrix.image }}"
          echo "   Add exceptions with: cidx security vuln add <CVE> ${{ matrix.image }}"
          exit 1

  # Job 4: Check for expired exceptions
  check-exceptions:
    name: Check Exceptions
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      expired: ${{ steps.check.outputs.expired }}
      expiring: ${{ steps.check.outputs.expiring }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      # `vuln check` exits 1 when an exception has passed its expiry date. The
      # previous `if ... then ... else ...` swallowed the exit code *and* the
      # command's output, so an expired entry surfaced nowhere at all: neither
      # the job, nor the run, nor the report said which one had rotted (#238).
      #
      # The job still exits 0 on purpose. Failing here would leave the audit
      # red every day until someone edited the file, and a gate that is always
      # red is ignored exactly like one that is always green — the trap #247
      # documents for the scan gate. So the state is *reported*, not silenced:
      # annotated on the run here, named in the report below.
      - name: Check for expired exceptions
        id: check
        run: |
          ./bin/cidx security vuln check --days 7 --json > exceptions.json || true

          EXPIRED=$(jq '.expired | length' exceptions.json)
          EXPIRING=$(jq '.expiring | length' exceptions.json)

          # One annotation, not one per entry: GitHub keeps only 10 per step,
          # and a flood of them would bury the count that matters. The entries
          # themselves are listed in the report summary.
          if [ "$EXPIRED" -gt 0 ]; then
            echo "::error title=Expired vulnerability exceptions::$EXPIRED exception(s) in known-vulnerabilities.toml are past their expiry date and waive nothing until reviewed - see the Security Audit Report summary"
          fi
          if [ "$EXPIRING" -gt 0 ]; then
            echo "::warning title=Expiring vulnerability exceptions::$EXPIRING exception(s) expire within 7 days"
          fi

          if [ "$EXPIRED" -gt 0 ]; then
            STATUS=expired
          elif [ "$EXPIRING" -gt 0 ]; then
            STATUS=expiring
          else
            STATUS=ok
          fi

          {
            echo "status=$STATUS"
            echo "expired=$EXPIRED"
            echo "expiring=$EXPIRING"
          } >> "$GITHUB_OUTPUT"

          echo "Exception status: $STATUS ($EXPIRED expired, $EXPIRING expiring)"

  # Job 5: Generate consolidated report
  report:
    name: Report
    needs: [setup, trivy-scan, grype-scan, check-exceptions]
    if: always()
    runs-on: ubuntu-latest

    # `security-events: write` is what uploading a SARIF costs, and `issues:
    # write` is what rewriting the tracking issue costs. Both are granted here
    # rather than at the top of the file: the scan jobs pull images and run
    # third-party scanners on them, and none of that needs the ability to write
    # this repository's security findings, let alone its issues (#207, #301,
    # #308). The job-level block replaces the global one entirely, so
    # `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      - name: Download all scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "{trivy,grype}-*"
          merge-multiple: true

      - name: Generate Report
        run: |
          TRIVY_STATUS="${{ needs.trivy-scan.result }}"
          GRYPE_STATUS="${{ needs.grype-scan.result }}"
          EXCEPTIONS_STATUS="${{ needs.check-exceptions.outputs.status }}"
          EXPIRED_COUNT="${{ needs.check-exceptions.outputs.expired }}"
          EXPIRING_COUNT="${{ needs.check-exceptions.outputs.expiring }}"
          IMAGE_COUNT="${{ needs.setup.outputs.count }}"

          # Header
          echo "# 🔒 Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Images Scanned:** $IMAGE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Scanner Results Summary
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "$TRIVY_STATUS" = "success" ]; then
            echo "| Trivy | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Trivy | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$GRYPE_STATUS" = "success" ]; then
            echo "| Grype | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Grype | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Vulnerability Details
          echo "## 🔍 Vulnerability Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Process Trivy results
          if ls artifacts/trivy-*.txt 1> /dev/null 2>&1; then
            echo "### Trivy Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in artifacts/trivy-*.txt; do
              IMAGE_NAME=$(basename "$file" .txt | sed 's/^trivy-//' | tr '_' '/' | tr '_' ':')
              if grep -q "Total:" "$file" 2>/dev/null; then
                VULN_COUNT=$(grep -oP 'Total: \K\d+' "$file" 2>/dev/null || echo "0")
                if [ "$VULN_COUNT" != "0" ]; then
                  echo "<details>" >> $GITHUB_STEP_SUMMARY
                  echo "<summary>📦 <code>$IMAGE_NAME</code> - $VULN_COUNT vulnerabilities</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat "$file" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              elif grep -qE "(HIGH|CRITICAL)" "$file" 2>/dev/null; then
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>📦 <code>$IMAGE_NAME</code> - vulnerabilities found</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$file" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

          # Process Grype results
          if ls artifacts/grype-*.txt 1> /dev/null 2>&1; then
            echo "### Grype Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in artifacts/grype-*.txt; do
              IMAGE_NAME=$(basename "$file" .txt | sed 's/^grype-//' | tr '_' '/' | tr '_' ':')
              if grep -qE "(High|Critical)" "$file" 2>/dev/null; then
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>📦 <code>$IMAGE_NAME</code> - vulnerabilities found</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$file" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

          # Exception Status
          # "Some exceptions have expired or will expire soon" said neither
          # how many nor which, and read the same whether one entry was a week
          # past its date or the whole file had rotted (#238). Name them.
          echo "## 📋 Vulnerability Exceptions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$EXCEPTIONS_STATUS" = "ok" ]; then
            echo "✅ All exceptions are valid and not expired." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **$EXPIRED_COUNT expired**, $EXPIRING_COUNT expiring within 7 days." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "An expired exception waives nothing: it was written with a date so that the" >> $GITHUB_STEP_SUMMARY
            echo "acceptance would be re-argued, not inherited. Re-date it, or delete it." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            EXPIRED_LIST=$(./bin/cidx security vuln check --days 7 --json 2>/dev/null \
              | jq -r '.expired[] | "| \(.CVE) | \(.Repository) | \(.Severity) | \(.Expires) |"')
            if [ -n "$EXPIRED_LIST" ]; then
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>⏰ Expired exceptions ($EXPIRED_COUNT)</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Repository | Severity | Expired |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|------------|----------|---------|" >> $GITHUB_STEP_SUMMARY
              echo "$EXPIRED_LIST" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Current Exceptions List
          echo "### Current Exceptions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          EXCEPTIONS=$(./bin/cidx security vuln list 2>/dev/null)
          if [ -n "$EXCEPTIONS" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$EXCEPTIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No exceptions configured_" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Next Steps
          if [ "$TRIVY_STATUS" != "success" ] || [ "$GRYPE_STATUS" != "success" ]; then
            echo "## 🛠️ Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Review vulnerability details above" >> $GITHUB_STEP_SUMMARY
            echo "2. For accepted risks, add exceptions:" >> $GITHUB_STEP_SUMMARY
            echo '   ```bash' >> $GITHUB_STEP_SUMMARY
            echo '   cidx security vuln add <CVE-ID> <IMAGE>' >> $GITHUB_STEP_SUMMARY
            echo '   ```' >> $GITHUB_STEP_SUMMARY
            echo "3. Verify exceptions work locally:" >> $GITHUB_STEP_SUMMARY
            echo '   ```bash' >> $GITHUB_STEP_SUMMARY
            echo '   cidx security vuln verify' >> $GITHUB_STEP_SUMMARY
            echo '   ```' >> $GITHUB_STEP_SUMMARY
            echo "4. Commit and push changes" >> $GITHUB_STEP_SUMMARY
          fi

      # A CVE scan says what is broken today; it never says whether anything
      # will ever fix it. Once the distribution under an image stops being
      # supported its packages receive no further updates, and every finding on
      # it becomes permanent however fresh the tag is (#303).
      #
      # This runs here rather than in container-monitor.yml for two reasons.
      # The base is only knowable from a scan result — Trivy reports it in
      # `Metadata.OS` — and `cidx preset scan-targets`, where the sibling
      # signals `missing` and `frozen_variant` live, runs before anything has
      # been scanned. And this job already holds the Trivy results for every
      # image the catalogue actually ships, daily, which is the population the
      # signal is about; the monitor also scans candidates, whose base is
      # provisional until they are promoted.
      #
      # `--output` goes to the runner's temp directory: the committed
      # SECURITY-BASELINE.md is regenerated deliberately, from a full audit,
      # never as a side effect of a report step.
      #
      # `if: always()` and `|| true`: this is a report on top of a scan that
      # already happened. An outage at endoflife.date degrades to "not checked"
      # inside the command, and nothing about this step may turn an audit red
      # that its own findings did not.
      - name: Report base end of support
        if: always()
        run: |
          echo "## 📅 Base end of support" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The distribution each catalogue image is built on, and how long it still" >> $GITHUB_STEP_SUMMARY
          echo "receives security updates. A base past its date will never be fixed again," >> $GITHUB_STEP_SUMMARY
          echo "whatever the tag says — the same family of signal as a deleted image (#245)" >> $GITHUB_STEP_SUMMARY
          echo "or a frozen variant line (#252)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./bin/cidx security baseline \
            --results artifacts \
            --output "$RUNNER_TEMP/baseline.md" \
            --annotate 2>&1 | tee "$RUNNER_TEMP/base-eol.txt" || true
          # The annotations are re-emitted on their own line so GitHub picks
          # them up; inside the fenced block above they are only text.
          grep -v '^::' "$RUNNER_TEMP/base-eol.txt" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep '^::' "$RUNNER_TEMP/base-eol.txt" || true

      # The summary above is written once per run and read by whoever happens to
      # open that run. The Security tab keeps the same findings across runs,
      # dates them, and closes them by itself when a repin removes them — which
      # is the single place the catalogue's state was missing (#301).
      #
      # `if: always()` on both steps: the report step above can fail on a
      # malformed artifact, and the run is exactly the one whose findings are
      # worth publishing. A scan leg that died leaves no result, and the command
      # says which images it therefore had nothing to say about — an image with
      # no alerts here is not an image that is clean.
      - name: Render findings as SARIF
        if: always()
        run: ./bin/cidx security sarif --results artifacts -o catalogue.sarif

      - name: Publish to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: catalogue.sarif
          # One analysis for the whole catalogue. The alternative — one upload
          # per image, since two uploads without distinct categories overwrite
          # each other — would be 21 analyses the alert list offers no way to
          # filter by, all of which would have to be re-uploaded on every run to
          # stay current. What distinguishes an image in the UI is the alert
          # itself, and that works inside a single analysis.
          category: catalogue

      # Everything above is detail: one alert per finding in the Security tab,
      # one annotation per base on the run, one artifact per scanner. None of it
      # answers the question that comes first — how much is carried, how much of
      # it needs a human, what has already lapsed (#308).
      #
      # `cidx security summary` assembles that page from what this job already
      # holds. It is published to an issue rather than only to the run summary
      # because a run summary is read by whoever opens that run: the issue has an
      # address, a notification, and a body an agent can fetch.
      #
      # **One issue, rewritten.** A daily scan filing one issue per run would
      # produce 365 a year, which is the noise this page exists to replace. The
      # issue is found by its label and not by its title, which anyone can edit
      # and which carries no counts for that reason. No match means it does not
      # exist yet, so it is created; more than one match is ambiguous, and the
      # step fails saying which ones rather than picking one and rewriting a body
      # somebody else's issue was using.
      #
      # **No comment, ever.** The body is overwritten and the previous state is
      # gone, deliberately. What the catalogue carried on any past day is the git
      # log of SECURITY-BASELINE.md, and which acceptances stood is the git log
      # of known-vulnerabilities.toml — both committed, both diffable, both
      # already the record. Code scanning dates every finding and closes it by
      # itself. A comment per run would duplicate two histories that exist, and
      # a comment on a threshold would need yesterday's numbers, which nothing
      # here keeps: that state would have to be invented before it could be
      # compared.
      #
      # `if: always()` for the same reason as the two steps above: a run that
      # went red is exactly the one whose status is worth reading, and the page
      # names the images no scanner answered for rather than counting them clean.
      - name: Publish the status summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRACKING_LABEL: security-status
        run: |
          ./bin/cidx security summary --results artifacts -o "$RUNNER_TEMP/status.md"

          # The label is the key, so it has to exist before it can be applied.
          # Creating it here rather than by hand keeps the mechanism whole: a
          # fresh fork running this workflow gets the same issue.
          gh label create "$TRACKING_LABEL" \
            --description "The rewritten vulnerability status page (cidx security summary)" \
            --color 1D76DB >/dev/null 2>&1 || true

          MATCHES=$(gh issue list --label "$TRACKING_LABEL" --state open --json number --jq '.[].number')
          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)

          if [ "$COUNT" -gt 1 ]; then
            echo "::error title=Ambiguous vulnerability status issue::$COUNT open issues carry the '$TRACKING_LABEL' label ($(echo $MATCHES | tr '\n' ' ')). The audit will not guess which one is the status page - close the duplicates and re-run."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            gh issue create \
              --label "$TRACKING_LABEL" \
              --title "Vulnerability status: where the preset catalogue stands" \
              --body-file "$RUNNER_TEMP/status.md"
          else
            gh issue edit "$MATCHES" --body-file "$RUNNER_TEMP/status.md"
          fi

      - name: Final Status
        run: |
          TRIVY_RESULT="${{ needs.trivy-scan.result }}"
          GRYPE_RESULT="${{ needs.grype-scan.result }}"

          echo "📊 Scan Results:"
          echo "  Trivy: $TRIVY_RESULT"
          echo "  Grype: $GRYPE_RESULT"

          if [ "$TRIVY_RESULT" = "success" ] && [ "$GRYPE_RESULT" = "success" ]; then
            echo "✅ All security scans passed - no unhandled vulnerabilities!"
          else
            echo "❌ Unhandled vulnerabilities detected"
            echo "   Review the report above for details"
            echo "   Add exceptions with: cidx security vuln add <CVE> <IMAGE>"
            exit 1
          fi
