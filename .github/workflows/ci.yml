name: CIDX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Bootstrap: Build CIDX binary once, share across all jobs
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CIDX
        run: go build -o bin/cidx ./cmd/cidx

      - name: Upload CIDX binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cidx-binary
          path: bin/cidx
          retention-days: 1

  # Security: Scan for vulnerabilities and secrets
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for gitleaks

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run security checks
        run: ./bin/cidx run security

  # Code Quality: Linting and formatting
  code:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for commitizen

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run code quality checks
        run: ./bin/cidx run code

  # Test: Run unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # --stream defeats the CI auto-quiet, which buffers container output and
      # prints it only on failure. A green test job whose log shows nothing
      # cannot tell you whether the BDD scenarios ran or zero of them did --
      # the scenario and step totals are the evidence that the suite is a real
      # gate. It used to be --verbose, which bought the same output at the price
      # of logrus at Debug and the raw JSON of every image pull (issue #273).
      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run tests
        run: ./bin/cidx run --stream test

  # Build: Compile final binary (only on main branch)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [security, code, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Build final binary
        run: ./bin/cidx run build
