name: CIDX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Code quality is the first gate. Compiling the binary is the unavoidable
  # bootstrap needed to run CIDX itself; once built here it is shared with every
  # later job. A formatting or lint failure therefore stops security, tests and
  # the final build before they consume runner time.
  code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Bootstrap CIDX
        run: go build -o bin/cidx ./cmd/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run code quality checks
        run: ./bin/cidx run code

      - name: Upload CIDX binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cidx-binary
          path: bin/cidx
          retention-days: 1

  # Renovate does the mechanical part: choose a release that has served the
  # cooldown, update its tag and digest, and open a PR. This job owns the
  # decision. It scans the exact before/after pair from the PR and blocks only
  # a security regression, using the same tested verdict as Monday's monitor.
  container-promotion:
    name: Container Promotion
    if: github.event_name == 'pull_request'
    needs: [code]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_IMAGE: "aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
      GRYPE_IMAGE: "anchore/grype:v0.116.1@sha256:1e71065c0a4cff3e6bd3b8add525ffac4343eb4971694eb90a31cf6d4d3e85db"
    steps:
      # A passing promotion changes two committed views derived from the
      # catalogue. The same non-expiring App used by the Monday monitor writes
      # those views back to same-repository PRs; fork PRs remain read-only.
      - name: Mint a token for generated reports
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CIDX_BOT_APP_ID }}
          private-key: ${{ secrets.CIDX_BOT_PRIVATE_KEY }}

      - name: Checkout proposed catalogue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Read the exact image changes
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:pkg/presets/presets.toml" > /tmp/base-presets.toml
          ./bin/cidx preset promotion-targets --base /tmp/base-presets.toml > /tmp/promotion-targets.json
          IMAGES=$(jq -c '[.[] | .current_image, .scan_image] | unique' /tmp/promotion-targets.json)
          COUNT=$(jq 'length' /tmp/promotion-targets.json)
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "## Container promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -eq 0 ]; then
            echo "No catalogue image changes in this pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            jq -r '.[] | "- `\(.current_image)` → `\(.scan_image)` (\(.presets | join(", ")))"' /tmp/promotion-targets.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Login to Docker Hardened Images
        if: contains(steps.targets.outputs.images, 'dhi.io/') && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Scan current and proposed images
        if: steps.targets.outputs.count != '0'
        env:
          IMAGES: ${{ steps.targets.outputs.images }}
        run: |
          mkdir -p scan-results
          echo "$IMAGES" | jq -r '.[]' | while read -r IMAGE; do
            SAFE=$(echo "$IMAGE" | tr '/:@' '___')
            echo "Scanning $IMAGE"

            docker run --rm \
              -v "$HOME/.docker:/docker-config:ro" \
              -e DOCKER_CONFIG=/docker-config \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --quiet --format json \
              "$IMAGE" > "scan-results/trivy-$SAFE.json" || true

            docker run --rm \
              -v "$HOME/.docker:/docker-config:ro" \
              -e DOCKER_CONFIG=/docker-config \
              "$GRYPE_IMAGE" "$IMAGE" --quiet -o json \
              > "scan-results/grype-$SAFE.json" || true
          done

      - name: Decide the promotion
        id: verdict
        if: steps.targets.outputs.count != '0'
        run: |
          ./bin/cidx preset scan-verdicts \
            --targets /tmp/promotion-targets.json \
            --results scan-results > /tmp/promotion-verdicts.json

          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | if .promote then
            "### ✅ ACCEPTED — `\(.new_image)`\n\n\(.reason)"
          else
            "### ❌ REJECTED — `\(.new_image)`\n\n\(.reason)"
          end' /tmp/promotion-verdicts.json >> "$GITHUB_STEP_SUMMARY"

          REJECTED=$(jq '[.[] | select(.promote == false)] | length' /tmp/promotion-verdicts.json)
          echo "rejected=$REJECTED" >> "$GITHUB_OUTPUT"

      - name: Refresh the committed catalogue views
        if: steps.targets.outputs.count != '0' && steps.verdict.outputs.rejected == '0'
        run: |
          ./bin/cidx security baseline --results scan-results
          ./bin/cidx preset catalogue

      - name: Commit generated catalogue views to the PR
        if: >-
          steps.targets.outputs.count != '0'
          && steps.verdict.outputs.rejected == '0'
          && github.event.pull_request.head.repo.full_name == github.repository
          && steps.app-token.outputs.token != ''
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- SECURITY-BASELINE.md docs/reference/catalogue.md; then
            exit 0
          fi
          git config user.name "cidx-bot[bot]"
          git config user.email "cidx-bot[bot]@users.noreply.github.com"
          git add SECURITY-BASELINE.md docs/reference/catalogue.md
          git commit -m "docs(security): refresh container catalogue views"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Render findings for GitHub Security
        if: steps.targets.outputs.count != '0'
        run: ./bin/cidx security sarif --results scan-results -o promotion.sarif

      - name: Upload findings to GitHub Security
        if: steps.targets.outputs.count != '0'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: promotion.sarif
          category: container-promotion

      - name: Enforce the decision
        if: steps.verdict.outputs.rejected != '' && steps.verdict.outputs.rejected != '0'
        run: |
          echo "::error::Container promotion rejected; the summary names every newly introduced HIGH/CRITICAL finding."
          exit 1

  # Security: Scan for vulnerabilities and secrets
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [code]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for gitleaks

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # Keep the credential failure actionable in every job that authenticates;
      # docker/login-action itself reports only "unauthorized".
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run security checks
        run: ./bin/cidx run security

  # Test: Run unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [code]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # --stream defeats the CI auto-quiet, which buffers container output and
      # prints it only on failure. A green test job whose log shows nothing
      # cannot tell you whether the BDD scenarios ran or zero of them did --
      # the scenario and step totals are the evidence that the suite is a real
      # gate. It used to be --verbose, which bought the same output at the price
      # of logrus at Debug and the raw JSON of every image pull (issue #273).
      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Run tests
        run: ./bin/cidx run --stream test

  # Build: Compile final binary (only on main branch)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [security, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CIDX binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidx-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cidx

      - name: Login to Docker Hardened Images
        id: dhi-login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # docker/login-action answers `unauthorized: Unauthorized` and nothing
      # else, on nine steps across three workflows that fail at once — which
      # reads as a broken repository rather than one expired credential. It took
      # pushing an empty commit from main to establish that the pull request
      # under review was not the cause (#399). The action cannot explain itself;
      # this step can, and it changes no outcome: the job has already failed.
      - name: Explain the failed DHI login
        if: failure() && steps.dhi-login.conclusion == 'failure'
        run: |
          echo "::error::Could not authenticate to dhi.io — the catalogue's images cannot be pulled."
          echo ""
          echo "A credential, not a code change: every branch fails this way until it is fixed."
          echo ""
          echo "  1. A Docker Hub password change revokes personal access tokens. If the password"
          echo "     changed, DOCKERHUB_TOKEN is dead and a new one is needed:"
          echo "     https://app.docker.com/settings/personal-access-tokens"
          echo "     (Public Repo Read-only is enough to pull.)"
          echo ""
          echo "  2. Put it back at the REPOSITORY level, which is what these jobs read:"
          echo "       gh secret set DOCKERHUB_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "     A secret of the same name on an environment or the organisation is shadowed"
          echo "     by the repository one. To see which you actually updated, compare the dates:"
          echo "       gh api repos/${{ github.repository }}/actions/secrets"
          echo ""
          echo "  3. Locally, 'cidx doctor' reports this too."

      - name: Build final binary
        run: ./bin/cidx run build
