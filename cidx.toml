# cidx — dogfooded config (used by `cidx run ci`, `cidx run docker`, ...).
#
# This is the minimal, functional config for building cidx itself.
# For the full catalog of options, defaults, and worked examples, see:
#   examples/cidx-complete.toml      (every option, every section, fully commented)
#   examples/cidx.toml               (minimal starter)
#   examples/cidx-advanced.toml      (small custom config)

# ─── release & tag workflow (used by `cidx release`, `cidx release tag`) ───
[release_workflow]
main_branch = "main"
allow_release_from_any_branch = true

[tag_workflow]
prefix = "v"
use_commitizen = true
auto_push = true
require_annotated = true
protected_tags = ["v1.*"]
linked_to_release = true

# ─── phases ───
[security]
containers = ["trivy", "gitleaks"]

[code]
containers = ["prettier", "golangci-lint", "commitizen", "shellcheck"]

[test]
containers = ["go-test"]

[build]
containers = ["go-build"]

[docker]
containers = ["kaniko"]

[release]
containers = ["gh-release"]

# Formatting is written here and only here: `cidx run format`, on demand, never
# from a pipeline. No [pipelines.*] lists this phase, so CI cannot run it — the
# `code` phase checks (prettier's preset default is `--check`), this one fixes.
# Same split as Go: golangci-lint's gofmt formatter gates CI, `go fmt` writes.
[format]
containers = ["prettier-write"]

# ─── container overrides ───
[containers.trivy]
severity = "HIGH,CRITICAL"
exit_code = 0

# prettier in write mode, as a separate entry rather than `[containers.prettier]
# write = true`: overrides are keyed by container name, not by phase, so a
# `write` on `prettier` would follow it into the `code` phase — which is exactly
# the bug this replaces (#272). Same image as the `prettier` preset; the
# catalogue pin is what governs the checking side.
[containers.prettier-write]
phase = "format"
image = "jauderho/prettier:3.9.4@sha256:b233d9c847048561850a1a107e35318b28361cd9a850eac7edcd5d8bfd82cea2"
command = "--write ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

# The catalogue default for go-test is `go test -v ./pkg/... ./cmd/...`, which
# leaves out the root package — exactly where this repo keeps its godog suite
# (features_test.go + the *_steps_test.go definitions). Without this override
# the BDD scenarios never run in CI, so nothing enforces the specs the project
# is built around. `./...` covers every package, root included.
#
# GODOG_FORMAT=progress keeps the phase log readable: one character per step
# plus the scenario/step totals, instead of ~2000 lines of pretty output.
[containers.go-test]
command = "go test -v ./..."

[containers.go-test.env]
GODOG_FORMAT = "progress"

# ─── pipelines ───
[pipelines.ci]
phases = ["security", "code", "test", "build"]
description = "Full CI pipeline for all commits"

[pipelines.pr]
phases = ["security", "code", "test"]
description = "Pull request validation (no build artifacts)"

[pipelines.main]
phases = ["security", "code", "test", "build"]
description = "Main branch pipeline (builds artifacts)"

# The end-to-end release rehearsal, run locally: `cidx run release` walks every
# phase with the local guardrails on (gh-release drafts, kaniko does not push),
# which is the whole point of declaring it here.
#
# No workflow implements it. `release.yml` is the *publication* workflow: it
# cross-compiles and attaches assets with softprops/action-gh-release — release
# publishing is deliberately not cidx's job (CLAUDE.md, "Scope") — and delegates
# only the `docker` phase to `cidx run`. Comparing it with this list compares
# two things that are not meant to coincide, so it is declared out (#233).
[pipelines.release]
phases = ["security", "code", "test", "build", "docker", "release"]
description = "Complete release pipeline"
workflow = "none"

# ─── release-create action (commitizen version bump, routed through a PR) ───
[actions.release-create]
description = "Create new release with version bump"
image = "commitizen/commitizen:latest"
command = "bump --yes --no-verify"
workdir = "/app"
volumes = [
    "${WORKSPACE}:/app",
    "${WORKSPACE}/.git:/app/.git",
]
watch_workflow = true

[actions.release-create.env]
GIT_CONFIG_GLOBAL = "/tmp/.gitconfig"
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "safe.directory"
GIT_CONFIG_VALUE_0 = "/app"
