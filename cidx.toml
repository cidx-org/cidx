# cidx — dogfooded config (used by `cidx run ci`, `cidx run docker`, ...).
#
# This is the minimal, functional config for building cidx itself.
# For the full catalog of options, defaults, and worked examples, see:
#   examples/cidx-complete.toml      (every option, every section, fully commented)
#   examples/cidx.toml               (minimal starter)
#   examples/cidx-advanced.toml      (small custom config)

# ─── release & tag workflow (used by `cidx release`, `cidx release tag`) ───
[release_workflow]
main_branch = "main"
allow_release_from_any_branch = true

[tag_workflow]
prefix = "v"
use_commitizen = true
auto_push = true
require_annotated = true
protected_tags = ["v1.*"]
linked_to_release = true

# ─── phases ───
[security]
containers = ["trivy", "gitleaks"]

[code]
containers = ["prettier", "renovate", "golangci-lint", "commitizen", "shellcheck"]

[test]
containers = ["go-test"]

[build]
containers = ["go-build"]

[docker]
containers = ["kaniko"]

[release]
containers = ["gh-release"]

# Formatting is written here and only here: `cidx run format`, on demand, never
# from a pipeline. No [pipelines.*] lists this phase, so CI cannot run it — the
# `code` phase checks (prettier's preset default is `--check`), this one fixes.
# Same split as Go: golangci-lint's gofmt formatter gates CI, `go fmt` writes.
[format]
containers = ["prettier-write"]

# The catalogue scan: `cidx run catalogue-scan` scans the images the built-in
# catalogue ships with Trivy and Grype and writes every finding to security.sarif
# (see the container below). Like `format`, no [pipelines.*] lists this phase, so
# CI never runs it; the `security` phase above is the repository's own gate
# (trivy and gitleaks on the source) and this one does not touch it.
[catalogue-scan]
containers = ["catalogue-scanner"]

# The baseline: `cidx run baseline` scans the catalogue (same scan, same cache in
# .cidx/scan) and then regenerates SECURITY-BASELINE.md from the raw results of
# that scan, with this repository's own code, in the current directory. It is the
# one command a tool run can launch to refresh the committed file. Like `format`
# and `catalogue-scan`, no [pipelines.*] lists it: CI never runs it, and it never
# commits anything.
#
# The baseline file is only written after a scan that succeeded: an incomplete
# scan (an image no scanner answered for, or only one) makes `security scan` fail,
# and the baseline then runs with --incomplete, which writes the triage sheets of
# the images that are complete and the index naming the others, leaves the file
# on disk alone and fails. It is never one built on a partial measurement.
[baseline]
containers = ["catalogue-baseline"]

# ─── container overrides ───
[containers.trivy]
severity = "HIGH,CRITICAL"
exit_code = 0

# prettier in write mode, as an alias of the catalogue preset rather than as
# `[containers.prettier] write = true`: overrides are keyed by container name,
# not by phase, so a `write` on `prettier` would follow it into the `code` phase
# (#272). The alias is the same preset under another name, so the image is the
# catalogue's pin and no copy of it lives here (#292).
[containers.prettier-write]
preset = "prettier"
command = "--write ."
phase = "format"

# The catalogue scan, as an alias of go-build: the toolchain image is the
# catalogue's pin, and the command builds and runs `cidx security scan` from the
# source in the workspace. That command starts the scanners itself, as sibling
# containers, through the Docker socket mounted below.
#
# Sibling containers mount host paths, so the scan cache lives under the working
# directory and is named by its host path: run this from the repository root
# (${PWD}). The registry credentials of the host are handed to the scanners, read
# only, for the hardened images. The advisory databases and the raw scan results stay in .cidx/scan
# (ignored), which is what makes the second run cheap.
#
# Acceptances in known-vulnerabilities.toml are not read: the scanners run with
# no ignore file, so an accepted finding is in the report like any other.
[containers.catalogue-scanner]
preset = "go-build"
command = "go run ./cmd/cidx security scan"
phase = "catalogue-scan"
timeout = "60m"
volumes = [
    "${WORKSPACE}:/work",
    "/var/run/docker.sock:/var/run/docker.sock",
    # The Go module and build caches, kept in .cidx/go (ignored) so that a new
    # container does not download every module again. The executor creates them as
    # the host user, and adds the socket's group to the container by itself: the
    # user that runs cidx needs no `--group-add` here.
    "${WORKSPACE}/.cidx/go/mod:/tmp/go-mod-cache",
    "${WORKSPACE}/.cidx/go/build:/tmp/go-build-cache",
    # The scan cache (advisory databases, results filed by image digest), shared by
    # every checkout of this machine: a new checkout finds the databases and the
    # results of the digests already scanned instead of pulling 21 images again.
    # To move it, change this path and CIDX_SCAN_HOST_CACHE below together.
    "${HOME}/.cache/cidx/scan:/tmp/scan-cache",
]

[containers.catalogue-scanner.env]
CIDX_SCAN_CACHE = "/tmp/scan-cache"
CIDX_SCAN_HOST_CACHE = "${HOME}/.cache/cidx/scan"
# Where the scan falls back, with a warning, when the shared cache cannot be
# written to (a directory the daemon made as root): the checkout's own cache.
CIDX_SCAN_FALLBACK_CACHE = ".cidx/scan"
CIDX_SCAN_FALLBACK_HOST_CACHE = "${PWD}/.cidx/scan"
CIDX_SCAN_RESULTS = ".cidx/scan/results"
CIDX_SCAN_DOCKER_CONFIG = "${HOME}/.docker"

# The baseline, as another alias of go-build with the same mounts and cache as
# the scan above: it runs `security scan`, then `security baseline` on the raw
# results the scan just left in .cidx/scan/results. A warm cache (databases and Go
# caches) makes the whole phase fit in 30 minutes; the scan itself fails, and the
# baseline with it, if an image was not fully scanned.
[containers.catalogue-baseline]
preset = "go-build"
command = "sh -c 'if go run ./cmd/cidx security scan; then go run ./cmd/cidx security baseline --results .cidx/scan/results; else go run ./cmd/cidx security baseline --incomplete --results .cidx/scan/results; exit 1; fi'"
phase = "baseline"
timeout = "30m"
volumes = [
    "${WORKSPACE}:/work",
    "/var/run/docker.sock:/var/run/docker.sock",
    "${WORKSPACE}/.cidx/go/mod:/tmp/go-mod-cache",
    "${WORKSPACE}/.cidx/go/build:/tmp/go-build-cache",
    "${HOME}/.cache/cidx/scan:/tmp/scan-cache",
]

[containers.catalogue-baseline.env]
CIDX_SCAN_CACHE = "/tmp/scan-cache"
CIDX_SCAN_HOST_CACHE = "${HOME}/.cache/cidx/scan"
CIDX_SCAN_FALLBACK_CACHE = ".cidx/scan"
CIDX_SCAN_FALLBACK_HOST_CACHE = "${PWD}/.cidx/scan"
CIDX_SCAN_RESULTS = ".cidx/scan/results"
CIDX_SCAN_DOCKER_CONFIG = "${HOME}/.docker"

# There is no `command` override here anymore, and that is the point of #357.
# The catalogue used to run `go test -v ./pkg/... ./cmd/...`, which skipped the
# root package — where this repo keeps its godog suite — and, since #317,
# internal/commands, where every CLI test lives. This file carried a one-line
# override to put them back, and twice the override was the only thing standing
# between a green Test job and a suite that had never been compiled (#271,
# #344). A default that every project has to repair is not a default, so the
# catalogue says `./...` now and this repository states nothing.
#
# TestTheTestPhaseRunsEveryPackageThatHasTests (pkg/config) still resolves the
# command the runner's way and fails on a package it does not reach — it now
# guards the catalogue default itself rather than a local override.
#
# GODOG_FORMAT=progress keeps the phase log readable: one character per step
# plus the scenario/step totals, instead of ~2000 lines of pretty output.
[containers.go-test.env]
GODOG_FORMAT = "progress"

# ─── pipelines ───
[pipelines.ci]
phases = ["code", "security", "test", "build"]
description = "Full CI pipeline for all commits"

[pipelines.pr]
phases = ["code", "security", "test"]
description = "Pull request validation (no build artifacts)"

[pipelines.main]
phases = ["code", "security", "test", "build"]
description = "Main branch pipeline (builds artifacts)"

# The end-to-end release rehearsal, run locally: `cidx run release` walks every
# phase with the local guardrails on (gh-release previews, kaniko does not build or push),
# which is the whole point of declaring it here.
#
# No workflow implements it. `release.yml` is the *publication* workflow: it
# cross-compiles and attaches assets with softprops/action-gh-release — release
# publishing is deliberately not cidx's job (CLAUDE.md, "Scope") — and delegates
# only the `docker` phase to `cidx run`. Comparing it with this list compares
# two things that are not meant to coincide, so it is declared out (#233).
[pipelines.release]
phases = ["code", "security", "test", "build", "docker", "release"]
description = "Complete release pipeline"
workflow = "none"

# ─── release-create action (commitizen version bump, routed through a PR) ───
[actions.release-create]
description = "Create new release with version bump"
# Pinned by digest like every catalogue image (rule 1); Renovate moves it
# together with the commitizen preset, under the same cooldown.
image = "commitizen/commitizen:4.19.3@sha256:049443ca2fcb3fd55741736f4fcd02abc0a61ad142559bcbd8c3427922c3d2fd"
command = "bump --yes --no-verify"
workdir = "/app"
volumes = [
    "${WORKSPACE}:/app",
    "${WORKSPACE}/.git:/app/.git",
]
watch_workflow = true

[actions.release-create.env]
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "safe.directory"
GIT_CONFIG_VALUE_0 = "/app"
