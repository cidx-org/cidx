[presets.ansible-galaxy-publish.env]
ARTIFACT = "./dist/*.tar.gz"
ANSIBLE_GALAXY_TOKEN = "${ANSIBLE_GALAXY_TOKEN}"

[presets.ansible-galaxy-publish.options.server]
type = "string"
default = "https://galaxy.ansible.com"
description = "Galaxy server URL (or Automation Hub)"
command_flag = "--server"

[presets.test-hot-reload]
name = "test-hot-reload"
phase = "test"
image = "dhi.io/alpine-base:3.24@sha256:84a21d3dfb87eb1c0bf1b532350f2aa0bf7d0df6246c398cc5c14b29002b7310"
hardened = true
command = "echo 'Hot reload works!'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GO SECURITY - Go-specific security scanning
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Gosec: Go Security Checker - inspects Go source code for security issues
# Official image: ghcr.io/securego/gosec — the only registry the project's
# release workflow pushes to. Its Docker Hub mirror (docker.io/securego/gosec)
# stopped at 2.24.6 on 2026-02-28 while upstream kept releasing, so the tag
# looked like upstream's head and was four minor versions behind it (#238).
# Detects: SQL injection, command injection, hardcoded credentials, etc.
[presets.gosec]
name = "gosec"
phase = "security"
image = "ghcr.io/securego/gosec:2.28.0@sha256:4342ad119a7c69f3f4e4ce78d81ba183dc774a70a7a4c6eeb15fe9e511f214f0"
command = "./..."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.gosec.env]
HOME = "/tmp"
GOTOOLCHAIN = "auto"

[presets.gosec.options.severity]
type = "string"
default = "medium"
description = "Minimum severity (low, medium, high)"
command_flag = "-severity"

[presets.gosec.options.confidence]
type = "string"
default = "medium"
description = "Minimum confidence (low, medium, high)"
command_flag = "-confidence"

[presets.gosec.options.format]
type = "string"
default = "text"
description = "Output format (text, json, csv, junit-xml, html, sarif, sonarqube)"
command_flag = "-fmt"

# Govulncheck: Official Go vulnerability scanner
# Official image: golang:alpine (installs govulncheck at runtime)
# Detects: Known vulnerabilities in Go dependencies (CVEs)
[presets.govulncheck]
name = "govulncheck"
phase = "security"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "sh -c 'go install golang.org/x/vuln/cmd/govulncheck@latest && PATH=$PATH:/tmp/go/bin govulncheck ./...'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.govulncheck.env]
HOME = "/tmp"
GOPATH = "/tmp/go"
GOTOOLCHAIN = "auto"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GO TOOLS - Linting, testing, and building Go projects
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Go Mod Tidy: Verify go.mod and go.sum are clean
# Official image: golang:alpine (official Go Docker image)
# Checks: go.mod is tidy (no unused deps, all required deps present)
#
# GOPATH is not decoration: `go mod tidy` downloads modules, and the default
# GOPATH is /go on every golang image. cidx runs the container as the invoking
# uid, so the first write dies with `mkdir /go/pkg: permission denied`. The five
# sibling Go presets all pin /tmp/go; this one did not, on any image.
[presets.go-mod-tidy]
name = "go-mod-tidy"
phase = "code"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "sh -c 'cp go.mod go.mod.bak && cp go.sum go.sum.bak && go mod tidy && diff go.mod go.mod.bak && diff go.sum go.sum.bak && echo \"go.mod is tidy\"'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.go-mod-tidy.env]
HOME = "/tmp"
GOPATH = "/tmp/go"
GOTOOLCHAIN = "auto"

# GolangCI-Lint: Fast Go linters aggregator
# Official image: golangci/golangci-lint (maintained by golangci-lint team)
# ✅ Container-first: Pre-configured with 50+ linters
# The `-alpine` variant, not the default Debian one: same publisher, same tool
# build, same entrypoint — but the Debian 13 base carried 515 of the image's
# HIGH/CRITICAL findings and all 23 of its CRITICALs (#238).
# Runs: staticcheck, govet, errcheck, gosec, and many more
[presets.golangci-lint]
name = "golangci-lint"
phase = "code"
image = "golangci/golangci-lint:v2.12.2-alpine@sha256:91b27804074a0bacea298707f016911e60cf0cdbc6c7bf5ccacb5f0606d18d60"
command = "golangci-lint run --timeout 5m"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = [".golangci.yml", ".golangci.yaml", ".golangci.toml", ".golangci.json"]

[presets.golangci-lint.env]
HOME = "/tmp"
GOLANGCI_LINT_CACHE = "/tmp/.cache"

[presets.golangci-lint.options.fix]
type = "bool"
default = false
description = "Automatically fix issues where possible"
command_flag = "--fix"

# Shellcheck: Static analysis for shell scripts
[presets.shellcheck]
name = "shellcheck"
phase = "code"
image = "koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d"
entrypoint = ["sh", "-c"]
command = "find . -type f -name \"*.sh\" | xargs -r shellcheck || true"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.shellcheck.options.severity]
type = "string"
default = "style"
description = "Minimum severity (error, warning, info, style)"
command_flag = "--severity"

[presets.gofmt]
name = "gofmt"
phase = "code"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "gofmt -l ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.gofmt.env]
GOTOOLCHAIN = "auto"

# Go Test: Run Go unit and integration tests
# Official image: golang:alpine (official Go Docker image)
# ✅ Container-first: Full Go toolchain included
# Features: Run tests with coverage, race detection, benchmarks
[presets.go-test]
name = "go-test"
phase = "test"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "go test -v ./pkg/... ./cmd/..."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.go-test.env]
HOME = "/tmp"
GOPATH = "/tmp/go"
GOMODCACHE = "/tmp/go-mod-cache"
GOCACHE = "/tmp/go-build-cache"
GOTOOLCHAIN = "auto"

[presets.go-test.options.coverage]
type = "bool"
default = false
description = "Generate coverage report"
command_flag = "-cover"

[presets.go-test.options.race]
type = "bool"
default = false
description = "Enable race detector"
command_flag = "-race"

# Godog: Run the BDD suite of a Go project
# Official image: golang:alpine (official Go Docker image)
# ✅ Container-first: Full Go toolchain included
#
# The command must compile whole packages, never a single file: godog step
# definitions live in sibling `*_steps_test.go` files, so `go test ./suite_test.go`
# fails to build with `undefined: RegisterXxxSteps`. `-run TestFeatures` selects
# the suite entrypoints by the name godog's own documentation uses, and matches
# as an unanchored regexp, so companion suites (TestFeaturesDocker, ...) run too.
[presets.godog]
name = "godog"
phase = "test"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "go test -v -run TestFeatures ./..."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.godog.env]
HOME = "/tmp"
GOPATH = "/tmp/go"
GOMODCACHE = "/tmp/go-mod-cache"
GOCACHE = "/tmp/go-build-cache"
CGO_ENABLED = "0"
GOTOOLCHAIN = "auto"

# Exported as an environment variable, which is the only channel that survives
# `go test`: godog reads its options from the suite's godog.Options, not from
# the command line, unless the suite calls godog.BindCommandLineFlags. A suite
# that does `Format: os.Getenv("GODOG_FORMAT")` picks this up; one that does not
# simply ignores it.
#
# There is deliberately no `tags` option: it used to emit `-tags`, which is
# `go test`'s build-constraint flag, so `tags = "@smoke"` broke the build
# instead of filtering scenarios. Filter by tag from the suite's
# godog.Options.Tags, or override `command` in cidx.toml.
[presets.godog.options.format]
type = "string"
default = "pretty"
description = "Output format (pretty, progress, junit, cucumber) via GODOG_FORMAT"
env_var = "GODOG_FORMAT"

# Go Build: Compile Go binary with version injection
# Official image: golang:alpine (official Go Docker image)
# ✅ Container-first: Full Go compiler toolchain
# Features: Version injection from VERSION file, custom ldflags
[presets.go-build]
name = "go-build"
phase = "build"
image = "dhi.io/golang:1.26.5-alpine-dev@sha256:29fe0a7d2a5ab0c236fbde3a7f63801755585ed260b6f2f564e831c92bfa9f34"
hardened = true
command = "sh -c 'VERSION=$(cat VERSION 2>/dev/null || echo dev); go build -ldflags \"-X main.Version=${VERSION} ${LDFLAGS}\" -o bin/cidx ./cmd/cidx'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.go-build.env]
HOME = "/tmp"
GOPATH = "/tmp/go"
GOMODCACHE = "/tmp/go-mod-cache"
GOCACHE = "/tmp/go-build-cache"
LDFLAGS = ""
GOTOOLCHAIN = "auto"

[presets.go-build.options.ldflags]
type = "string"
default = ""
description = "Additional linker flags for go build"
env_var = "LDFLAGS"

