# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      CIDX Built-in Container Presets                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# This file defines all built-in container configurations embedded into cidx binary.
#
# 🛡️ SECURITY-FIRST: Docker Hardened Images (DHI)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CIDX uses Docker Hardened Images (dhi.io) by default for maximum security.
#
# Why DHI?
# - 🛡️ Near-zero CVEs (guaranteed minimal vulnerabilities)
# - 📦 Up to 95% smaller attack surface
# - 📋 SBOM included (full software bill of materials)
# - 🔐 SLSA Level 3 provenance (cryptographic proof of authenticity)
# - ✅ Compatible with Alpine/Debian (familiar base images)
#
# Image Priority:
# 1. Docker Hardened Images (dhi.io/*) - preferred for security
# 2. Official vendor images - when DHI not available
# 3. Community images - last resort, monitored for CVEs
#
# Authentication:
# DHI requires Docker Hub login: docker login dhi.io
# Use your Docker Hub credentials (same as hub.docker.com)
#
# Development:
# - Edit this file → Changes picked up with 'go run ./cmd/cidx'
# - Build → This file embedded into binary via go:embed
#
# Structure:
# - [presets.container-name]       : Main configuration
# - [presets.container-name.env]   : Environment variables
# - [presets.container-name.options.X] : Configurable options

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CODE QUALITY PHASE - Linting, formatting, and style enforcement
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Prettier: Auto-format code (JS, TS, JSON, YAML, Markdown, etc.)
# Prettier publishes no image of its own, so this is a third-party build.
# jauderho/prettier rebuilds weekly from a current Alpine and ships SBOM +
# provenance; tmknom/prettier, which this replaces, was last published
# 2025-06-30 and its base had been accumulating CVEs for thirteen months (#238).
# The image entrypoint is `prettier` itself, so the command carries args only.
[presets.prettier]
name = "prettier"
phase = "code"
image = "jauderho/prettier:3.9.4@sha256:b233d9c847048561850a1a107e35318b28361cd9a850eac7edcd5d8bfd82cea2"
command = "--check ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = [
    ".prettierrc",
    ".prettierrc.json",
    ".prettierrc.yml",
    "prettier.config.js",
]

[presets.prettier.options.write]
type = "bool"
default = false
description = "Write formatted files (instead of check)"
command_flag = "--write"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECURITY PHASE - Vulnerability scanning and secret detection
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Trivy: Container and filesystem vulnerability scanner
# 🛡️ DHI: Docker Hardened Image (near-zero CVEs)
# Scans: dependencies, OS packages, misconfigurations, secrets
#
# 0.68 → 0.71 is an ordinary promotion inside a live family, not a repin like
# #293's: dhi.io still publishes the unversioned trivy line, so nothing here is
# frozen. dhi.io dates no tag, so rule 2's 14-day cooldown cannot be measured on
# it, and rule 3's waiver is claimed out loud in its place: 0.68 carries 51 HIGH
# and 2 CRITICAL that affect us today (Trivy, DB of 2026-07-30; Grype counts 45
# HIGH/CRITICAL on the same image), 0.71 carries 0/0 by Trivy. Grype still finds
# two on 0.71 — GO-2026-5970 in golang.org/x/text and GHSA-hrxh-6v49-42gf in
# grpc, both advisory IDs Trivy does not carry — which the audit will surface as
# new findings; that is two, against fifty-three (#238).
[presets.trivy]
name = "trivy"
phase = "security"
image = "dhi.io/trivy:0.71@sha256:fd727baaf00f823f59c2936f2c797c61750e2440b736c5b787722c18dd9518aa"
hardened = true
command = "fs /work"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.trivy.env]
TRIVY_CACHE_DIR = "/tmp/trivy-cache"

[presets.trivy.options.severity]
type = "string"
default = "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
description = "Severities to report (comma-separated)"
command_flag = "--severity"

[presets.trivy.options.exit_code]
type = "int"
default = 0
description = "Exit code when vulnerabilities are found"
command_flag = "--exit-code"

# Gitleaks: Scan git history for secrets and credentials
# Detects: API keys, passwords, tokens in git history
# Kept on Docker Hub deliberately: ghcr.io/gitleaks/gitleaks:v8.30.1 is the
# byte-identical mirror (same index digest), and upstream publishes no slim or
# distroless variant. Its findings come from the alpine:3.22 pinned in the
# project's own Dockerfile, which only a new upstream release can move (#238).
[presets.gitleaks]
name = "gitleaks"
phase = "security"
image = "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
command = "git ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = [".gitleaks.toml"]

# Commitlint: Validate commit messages follow conventional commits
# Official image: commitlint/commitlint (official Docker image)
# ✅ Container-first: No npm install needed, image is ready-to-run
# Validates: commit message format (feat:, fix:, docs:, etc.)
[presets.commitlint]
name = "commitlint"
phase = "code"
image = "commitlint/commitlint:21.2.1@sha256:f4b38082bec66b4cd1b37a0357145dded515c4468e2b339ec9ba31f86461f6b9"
command = "commitlint --from ${FROM} --to ${TO}"
workdir = "/work"
volumes = [
    "${WORKSPACE}:/work",
    "${WORKSPACE}/.git:/work/.git",
]
config_files = [
    ".commitlintrc.json",
    ".commitlintrc.yml",
    ".commitlintrc.yaml",
    "commitlint.config.js",
    "commitlint.config.cjs",
]

[presets.commitlint.env]
FROM = "origin/main"
TO = "HEAD"

# Commitizen: Validate commit messages and manage version bumping
# Official image: commitizen/commitizen (official Docker image)
# ✅ Container-first: Ready-to-run, no pip install needed
# Features: Validates commits, bumps versions, generates changelog
[presets.commitizen]
name = "commitizen"
phase = "code"
image = "commitizen/commitizen:4.16.5@sha256:451d0150ed7804c51cf201b2e9bd3f351867badbb7dc98f195cad740fdeaabaa"
command = "sh -c 'export GIT_CONFIG_GLOBAL=/tmp/.gitconfig && git config --global --add safe.directory /work && BASE=$(git merge-base HEAD origin/main 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10) && COMMITS=$(git rev-list ${BASE}..HEAD --count 2>/dev/null || echo 0) && if [ \"$COMMITS\" = \"0\" ]; then echo \"No commits to validate\"; exit 0; fi && cz check --rev-range ${BASE}..HEAD'"
entrypoint = [""]
workdir = "/work"
volumes = [
    "${WORKSPACE}:/work",
    "${WORKSPACE}/.git:/work/.git",
]
config_files = [
    ".cz.toml",
    ".cz.json",
    "pyproject.toml",
]

[presets.ansible-lint]
name = "ansible-lint"
phase = "code"
image = "ghcr.io/ansible/community-ansible-dev-tools:v26.7.1@sha256:4d4db3e75c48ce64763d26adbca58ff3f8b93a8ddae785373ac973b4f20a7d92"
command = "ansible-lint"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = [".ansible-lint"]

[presets.molecule]
name = "molecule"
phase = "test"
image = "ghcr.io/ansible/community-ansible-dev-tools:v26.7.1@sha256:4d4db3e75c48ce64763d26adbca58ff3f8b93a8ddae785373ac973b4f20a7d92"
command = "molecule test -s ${SCENARIO}"
workdir = "/work"
volumes = [
    "${WORKSPACE}:/work",
    "/var/run/docker.sock:/var/run/docker.sock",
]

[presets.molecule.env]
SCENARIO = "default"

[presets.molecule.options.scenario]
type = "string"
default = "default"
description = "Molecule scenario to run"
env_var = "SCENARIO"

# Yamllint: Strict YAML validation (essential for Ansible)
# Using ansible dev-tools image for consistency
# Catches: indentation, line length, truthy values, etc.
[presets.yamllint]
name = "yamllint"
phase = "code"
image = "ghcr.io/ansible/community-ansible-dev-tools:v26.7.1@sha256:4d4db3e75c48ce64763d26adbca58ff3f8b93a8ddae785373ac973b4f20a7d92"
command = "yamllint ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = [".yamllint", ".yamllint.yml", ".yamllint.yaml"]

[presets.yamllint.options.strict]
type = "bool"
default = false
description = "Return non-zero exit code on warnings"
command_flag = "--strict"

[presets.yamllint.options.format]
type = "string"
default = "auto"
description = "Output format (auto, standard, colored, github, parsable)"
