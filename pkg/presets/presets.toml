# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# RUST LANGUAGE PACK - Linting, testing, security, and building
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# The pack runs on `rust:<version>-slim`, not the default image: same publisher,
# same toolchain, Debian without the ~270 MB of packages the compiler never
# touches — 429 HIGH/60 CRITICAL become 78/5. Deliberately not `-alpine`, which
# would be 0/0: alpine is musl, so every binary these presets produce would
# change libc. `probatum` already documents that a glibc artefact will not run
# on a musl image (#195); flipping the producer instead of the consumer would be
# the same trap with the arrow reversed.

# Rustfmt: Official Rust code formatter
# Included in official Rust image
# Public image: docker.io/library/rust (RUSTUP_HOME=/usr/local/rustup,
# CARGO_HOME=/usr/local/cargo come pre-set; toolchain pre-installed).
[presets.rustfmt]
name = "rustfmt"
phase = "code"
image = "rust:1.97.0-slim@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51"
command = "sh -c 'rustup component add rustfmt && cargo fmt -- --check'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = ["rustfmt.toml", ".rustfmt.toml"]

# Clippy: Official Rust linter
# The most comprehensive Rust linter
[presets.clippy]
name = "clippy"
phase = "code"
image = "rust:1.97.0-slim@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51"
command = "sh -c 'rustup component add clippy && cargo clippy -- -D warnings'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = ["clippy.toml", ".clippy.toml"]

[presets.clippy.options.pedantic]
type = "bool"
default = false
description = "Enable pedantic lints"
command_flag = "-W clippy::pedantic"

# Cargo Audit: Scan Rust dependencies for known vulnerabilities
# Official RustSec tool. Downloads the prebuilt release binary (seconds)
# instead of `cargo install` (compiles from source for minutes and can fail
# for reasons unrelated to the audited project — see #161). RustSec ships
# x86_64 and aarch64 linux-gnu assets, so $(uname -m) covers both.
# Extracts to /tmp (world-writable) instead of /usr/local/bin (root-owned):
# containers often run non-root (CI runners, user-mapped local runs) and tar
# cannot write there — see #188. HOME/CARGO_HOME point at writable dirs so
# the advisory DB fetch also works non-root; the binary is invoked directly
# (`cargo-audit audit` is RustSec's documented direct invocation) to avoid
# depending on PATH.
#
# Not a Rust image at all. Auditing a Cargo.lock needs the lockfile and the
# binary above, never a compiler, and the toolchain image was charging the whole
# catalogue for one preset: `rust:1.97.0` measures 364 HIGH/60 CRITICAL against
# 34/4 here (#287). `buildpack-deps:trixie-curl` is the Docker Official base
# `rust:` is itself built on, minus the toolchain, and carries exactly what the
# command needs — sh, curl, tar and CA certificates — so the command is
# unchanged but for the flag below. `rust:1.97.0-slim` was never an option: the
# official slim Dockerfile installs wget to fetch rustup and apt-removes it in
# the same layer, so the download dies on `sh: curl: not found`.
#
# Deliberately not alpine, which measures 0/0. RustSec publishes a musl asset
# for x86_64 only — `cargo-audit-aarch64-unknown-linux-musl` is a 404 — so a
# musl base would trade every aarch64 user for the last 38 findings. That is
# #195 with the arrow reversed, and glibc keeps both architectures on one line.
#
# --no-yanked because the yanked-crate check shells out to `cargo -V` to learn
# the crates.io index protocol; with no toolchain in the image it fails with
# `couldn't update crates.io index: registry: No such file or directory`.
# Skipping it explicitly beats printing that on every run. The RustSec advisory
# scan — the reason the preset exists — needs no cargo and no git binary either:
# the release binary fetches the advisory DB itself, verified on both
# architectures detecting RUSTSEC-2021-0139.
[presets.cargo-audit]
name = "cargo-audit"
phase = "security"
image = "buildpack-deps:trixie-curl@sha256:ef554489e8f8b0245ef3cb2742b4c6b6e53c43bd64366b13f624982c854af2eb"
command = "sh -c 'curl -sSfL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-$(uname -m)-unknown-linux-gnu-v0.22.2.tgz | tar xz --strip-components=1 -C /tmp && HOME=/tmp CARGO_HOME=/tmp/cargo /tmp/cargo-audit audit --no-yanked'"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.cargo-audit.options.deny]
type = "bool"
default = true
description = "Exit with error on vulnerabilities"
command_flag = "--deny warnings"

# Cargo Test: Run Rust tests
# Built-in Rust testing framework
[presets.cargo-test]
name = "cargo-test"
phase = "test"
image = "rust:1.97.0-slim@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51"
command = "cargo test"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.cargo-test.env]
RUST_BACKTRACE = "1"

[presets.cargo-test.options.release]
type = "bool"
default = false
description = "Run tests in release mode"
command_flag = "--release"

[presets.cargo-test.options.all_features]
type = "bool"
default = false
description = "Enable all features"
command_flag = "--all-features"

# Cargo Build: Build Rust project
# Official Rust compiler
[presets.cargo-build]
name = "cargo-build"
phase = "build"
image = "rust:1.97.0-slim@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51"
command = "cargo build --release"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]

[presets.cargo-build.options.target]
type = "string"
default = ""
description = "Target triple (e.g., x86_64-unknown-linux-musl)"
command_flag = "--target"

# Cargo Publish: Publish crate to crates.io
# Official Rust package registry
[presets.cargo-publish]
name = "cargo-publish"
phase = "release"
image = "rust:1.97.0-slim@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51"
command = "cargo publish"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
require_ci = true

[presets.cargo-publish.env]
CARGO_REGISTRY_TOKEN = "${CARGO_REGISTRY_TOKEN}"

[presets.cargo-publish.options.dry_run]
type = "bool"
default = false
description = "Perform a dry run"
command_flag = "--dry-run"

# Probatum: Test-oriented check runner (https://github.com/probatum-org/probatum)
# Runs the repo's probatum.yaml: service boot + readiness, HTTP checks, log
# windows, with owned teardown. Verdict: exit 0 pass, 1 failed, 2 couldn't run.
[presets.probatum]
name = "probatum"
phase = "test"
image = "ghcr.io/probatum-org/probatum:0.2.1@sha256:c78575afc4469d5d310f449f8133927d4b2859e6ea66a720d82205e1dfb09ef1"
# The image is Alpine/musl and ships no glibc loader; a glibc binary fails with
# the shell's misleading "sh: <path>: not found" even though the file exists (#195).
description = "Executes static or musl-linked artifacts only: the image is Alpine (no glibc loader), so glibc binaries built by cargo-build will not run (misleading 'sh: <path>: not found'). Build with --target x86_64-unknown-linux-musl."
command = "run"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
