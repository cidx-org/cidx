# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PYTHON LANGUAGE PACK - Linting, testing, security, and packaging
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# The six presets in this pack that install their tool at runtime — mypy,
# bandit, pip-audit, pytest, python-build, twine; not ruff or black, which ship
# ready-to-run images — all carry HOME = "/tmp" and prefix the tool with
# PATH=$PATH:/tmp/.local/bin, for the same reason cargo-audit carries
# HOME/CARGO_HOME (#188): cidx runs containers as the invoking uid, never root.
# pip therefore cannot write to the interpreter's site-packages and falls back
# to a user install under $HOME — which is `/` when HOME is unset, so the
# install dies with `Permission denied: '/.local'`. HOME = "/tmp" moves both
# that tree and pip's cache somewhere writable; the entry points then land in
# /tmp/.local/bin, which no image puts on PATH, so the invocation names it the
# way govulncheck names /tmp/go/bin. python-build needs only HOME: `python -m
# build` runs a module, and a --user install is on sys.path already.
#
# The defect was invisible until #293: the previous image (dhi.io/python:3.13-
# alpine3.21) ships no shell, so every one of these presets died at container
# init with `exec: "sh": executable file not found` and never reached pip.

# Ruff: Extremely fast Python linter and formatter (replaces flake8, isort, black)
# Official image: ghcr.io/astral-sh/ruff (maintained by Astral)
# ✅ Container-first: Ready-to-run, blazingly fast
[presets.ruff]
name = "ruff"
phase = "code"
image = "ghcr.io/astral-sh/ruff:0.8.2@sha256:84b0ad0023906db70b759b3b29e455dad0638159bf2de2b95086db1ab175917b"
command = "check ."
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
config_files = ["ruff.toml", "pyproject.toml", ".ruff.toml"]

[presets.ruff.options.fix]
type = "bool"
default = false
description = "Automatically fix violations"
command_flag = "--fix"

[presets.ruff.options.format]
type = "bool"
default = false
description = "Run formatter instead of linter"
command_flag = "format"

